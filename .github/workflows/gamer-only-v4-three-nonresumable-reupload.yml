name: Gamer - reupload exactly three V4 Shorts using non-resumable YouTube

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/gamer-v4-three-reupload-20261105.json'

permissions:
  contents: read

concurrency:
  group: gamer-three-v4-single-request-reupload-20261105
  cancel-in-progress: false

jobs:
  verify-exact-three-gamer-only:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'feat(gamer): resend only three V4 Shorts privately using single-request upload'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify explicit authorization, THREE Gamer episodes, no Alchemy, and new upload method
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_gamer_v4_three_reupload.py
          python -m py_compile scripts/gamer_v4_three_reupload.py

  upload-only-three-gamer:
    needs: verify-exact-three-gamer-only
    if: needs.verify-exact-three-gamer-only.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Google YouTube client before accessing OAuth secrets
        run: python -m pip install -r requirements-publicacao.txt
      - name: Reuse exact six-video V4 render artifact; no new render/generation
        uses: actions/download-artifact@v4
        with:
          name: gamer-alchemy-reference-v4-six
          run-id: 42074829801
          github-token: ${{ github.token }}
          path: gamer-original-v4-files/
      - name: Resend only three Gamer V4 MP4s in PRIVATE single-request uploads; check processing state
        env:
          GAMER_V4_THREE_REUPLOAD_APPROVED: 'true'
          ORIGINAL_RENDER_RUN: '42074829801'
          SOURCE_ARTIFACT_ID: '13439442112'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_GAMES_TOKEN_JSON }}
        run: python scripts/gamer_v4_three_reupload.py
      - name: Preserve every confirmed new video ID and processing status even if a later upload fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamer-three-v4-single-request-private-receipts
          path: gamer-three-reupload-receipts/gamer-v4-three-new-private-receipts.json
          retention-days: 7
          if-no-files-found: ignore
