name: Otaku V6 - Animated 90s Death Note real AutoEditorVideo review (no upload)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/otaku-90s-v6-animated-review.yml'

# One creator-requested V6 review: reuse the verified original prior-run artwork.
# Zero paid image calls, no dispatch, schedule, YouTube credentials or publishing.
permissions:
  contents: read

concurrency:
  group: otaku-v6-one-animated-90s-preview
  cancel-in-progress: false

jobs:
  preflight-safe-main:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'test(editor): render ONE V6 from pinned saved original artwork (no new images)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      IMAGE_MODEL: gpt-image-2
      MAX_IMAGE_CALLS: '20'
      OTAKU_V6_ONE_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check protected image environment BEFORE accessing secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/image_env_policy_guard.py
      - name: Install original Python test requirements without provider access
        run: python -m pip install --disable-pip-version-check -r requirements-master.txt 'pytest>=8,<10'
      - name: Check original editor contracts and one-test-only authorization
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_otaku_multicena_90s_v6_preview.py tests/test_otaku_multicena_pose_qa.py tests/test_otaku_multicena_duration_90.py tests/test_otaku_multicena_editorial_score_v5.py
          python scripts/otaku_multicena_90s_v6_preview.py --preflight
          jq -e '.pause_requested==true and .authorized_public==false and .maintenance_complete==false and .resume_authorized_after_maintenance==false' \
            conteudos/otaku-br-50-serial-launch-20261106.json
          echo "[REVIEW ONLY] NO_PUBLICATION_NOT_A_50_SHORT_RESUME"

  generate-one-with-real-autoeditorvideo:
    needs: preflight-safe-main
    if: needs.preflight-safe-main.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read
    env:
      IMAGE_MODEL: gpt-image-2
      MAX_IMAGE_CALLS: '0'
      OTAKU_V6_ONE_PREVIEW: '1'
      OTAKU_V6_REUSE_ARTIFACT: '42332358380'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-master.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion-remotion/package-lock.json
      - name: Prepare original AutoEditorVideo dependencies and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install --disable-pip-version-check -r requirements-master.txt
          command -v ffmpeg
          command -v ffprobe
      - name: Install original Remotion, not another video generator
        working-directory: motion-remotion
        run: npm ci --no-audit --no-fund
      - name: Validate original animated character components
        working-directory: motion-remotion
        run: npm run typecheck && npm run test:qa
      - name: Restore immutable original V6 frames and Edge narration from prior run
        uses: actions/download-artifact@v4
        with:
          name: otaku-v6-original-art-and-pose-evidence
          run-id: 42332358380
          github-token: ${{ github.token }}
          path: assets/gerados/otaku-v6-real-90s
      - name: Render ONE V6 with real saved RGBA poses and voice (zero image calls)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/otaku_multicena_90s_v6_preview.py
          echo "[REVIEW ONLY] ONE ORIGINAL V6 MP4_READY_NO_YOUTUBE_UPLOAD_NO_NEW_IMAGE_CALLS"
      - name: Preserve pose QA evidence even if rendering fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otaku-v6-verified-reuse-pose-qa
          path: |
            assets/gerados/otaku-v6-real-90s/pose-validation-v6.json
            assets/gerados/otaku-v6-real-90s/pose-validation-v6-reuse.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep ONE 90-second V6 MP4 for review, never publish
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: otaku-v6-death-note-animated-real-AutoEditorVideo-90s-review
          path: otaku-real-v6-review/
          if-no-files-found: error
          retention-days: 7
