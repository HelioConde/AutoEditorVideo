name: Gamer + Alchemy - six AI-illustrated Shorts one-shot

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/lote-6-games-alchemy-execucao-20261105.json'
  workflow_dispatch:
    # Manual re-run intentionally cannot spend images or upload:
    # render/upload guards require event=push and attempt=1.
    inputs:
      audit_only:
        description: 'Read-only test (NO generation and NO upload)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: games-alchemy-six-shorts-one-shot-20261105
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependency only
        run: python -m pip install 'pytest>=8,<10'
      - name: Validate new channel reservations and AI-only pilot
        run: |
          python -m pytest -q tests/test_games_alchemy_ai_six.py tests/test_youtube_channel_registry.py
          python scripts/games_alchemy_ai_six.py --action validate
      - name: Syntax-check generator and publisher without secrets
        run: |
          python -m py_compile scripts/games_alchemy_ai_six.py scripts/games_alchemy_ai_upload.py

  check-image-environment:
    needs: offline-contract
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'feat(games-alchemy): launch reserved six AI illustrated Shorts')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard protected main-only image-generation Environment WITHOUT secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/image_env_policy_guard.py

  check-youtube-environment:
    needs: offline-contract
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'feat(games-alchemy): launch reserved six AI illustrated Shorts')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard shared main-only YouTube Environment WITHOUT secrets (Games)
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_SLUG: games
        run: python scripts/youtube_new_channels_env_guard.py
      - name: Guard shared main-only YouTube Environment WITHOUT secrets (Alchemy)
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_SLUG: alchemy
        run: python scripts/youtube_new_channels_env_guard.py

  generate-six-shorts:
    needs: [offline-contract, check-image-environment]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'feat(games-alchemy): launch reserved six AI illustrated Shorts')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: image-generation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned original image provider proxy
        uses: actions/checkout@v4
        with:
          repository: 10/chatgpt-codex-proxy
          ref: 1da5476e46ef62830d7016de2a931b0b8270a6c4
          path: pinned-native-go-proxy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v6
        with:
          go-version-file: pinned-native-go-proxy/go.mod
          cache: false
      - name: Install AutoEditorVideo narration and image dependencies without secrets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-master.txt
      - name: Build pinned proxy before obtaining secrets
        working-directory: pinned-native-go-proxy
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/ai-six-native-proxy" ./cmd/api
      - name: Generate only 30 original AI images and render six Shorts
        shell: bash
        env:
          PROXY_ACCOUNTS_JSON: ${{ secrets.PROXY_ACCOUNTS_JSON }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
          IMAGE_MODEL: gpt-image-2
          MAX_IMAGE_CALLS: '30'
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/ai-six-private-proxy-state"
          test ! -e "$private_dir"
          mkdir -m 700 "$private_dir"
          proxy_pid=''
          cleanup() {
            if [ -n "$proxy_pid" ]; then kill "$proxy_pid" 2>/dev/null || true; fi
            rm -rf -- "$private_dir"
            rm -f -- "$RUNNER_TEMP/ai-six-proxy.log"
          }
          trap cleanup EXIT
          python scripts/proxy_accounts_private_stage.py "$private_dir"
          unset PROXY_ACCOUNTS_JSON
          DATA_DIR="$private_dir" DEBUG_LOG_PAYLOADS=false GIN_MODE=release PORT=8080 \
            "$RUNNER_TEMP/ai-six-native-proxy" > "$RUNNER_TEMP/ai-six-proxy.log" 2>&1 &
          proxy_pid=$!
          python scripts/games_alchemy_ai_six.py --action render
          echo 'SIX_SHORTS_GENERATION_FINISHED_NO_YOUTUBE_CREDS_ACCESSED'
      - name: Retain only public-facing finished MP4, cover, metadata and QA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: games-alchemy-six-ai-render
          path: cloud-games-alchemy-ai-six/
          retention-days: 3
          if-no-files-found: error

  upload-gamer-private:
    needs: [generate-six-shorts, check-youtube-environment]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      needs.generate-six-shorts.result == 'success' &&
      needs.check-youtube-environment.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: youtube-private-upload
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official YouTube API deps before accessing Secrets
        run: python -m pip install -r requirements-publicacao.txt
      - uses: actions/download-artifact@v4
        with:
          name: games-alchemy-six-ai-render
          path: cloud-games-alchemy-ai-six/
      - name: Upload only Gamer trio with its exclusive verified token
        env:
          AI_SIX_PILOT_USER_APPROVED: 'true'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_GAMES_TOKEN_JSON }}
        run: python scripts/games_alchemy_ai_upload.py --channel games
      - name: Preserve known video IDs even if thumbnails or API fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamer-ai-three-upload-receipts
          path: cloud-games-alchemy-ai-six/games-youtube-private-receipts.json
          retention-days: 7
          if-no-files-found: ignore

  upload-alchemy-private:
    needs: [generate-six-shorts, check-youtube-environment]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      needs.generate-six-shorts.result == 'success' &&
      needs.check-youtube-environment.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: youtube-private-upload
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official YouTube API deps before accessing Secrets
        run: python -m pip install -r requirements-publicacao.txt
      - uses: actions/download-artifact@v4
        with:
          name: games-alchemy-six-ai-render
          path: cloud-games-alchemy-ai-six/
      - name: Upload only Alchemy trio with its exclusive verified token
        env:
          AI_SIX_PILOT_USER_APPROVED: 'true'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_ALCHEMY_TOKEN_JSON }}
        run: python scripts/games_alchemy_ai_upload.py --channel alchemy
      - name: Preserve known video IDs even if thumbnails or API fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-ai-three-upload-receipts
          path: cloud-games-alchemy-ai-six/alchemy-youtube-private-receipts.json
          retention-days: 7
          if-no-files-found: ignore
