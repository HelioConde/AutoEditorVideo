name: Gamer + Alchemy - approved reference style six V4 private Shorts

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/games-alchemy-reference-v4-run-20261105.json'

permissions:
  contents: read

concurrency:
  group: games-alchemy-approved-reference-v4-six-20261105
  cancel-in-progress: false

jobs:
  offline-reference-style-qa:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'feat(games-alchemy): produce and privately upload six reference-style V4 Shorts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies, no YouTube secrets or image tokens
        run: python -m pip install 'pytest>=8,<10' 'Pillow>=10,<13'
      - name: Verify six V4 reservations, approved 5-second visual style, captions and source-frame plan
        run: |
          python -m pytest -q tests/test_gamer_reference_style_5s.py tests/test_games_alchemy_reference_v4.py
          python scripts/games_alchemy_reference_v4.py --action validate
          python -m py_compile scripts/games_alchemy_reference_v4.py scripts/games_alchemy_reference_v4_upload.py

  render-six-approved-v4:
    needs: offline-reference-style-qa
    if: needs.offline-reference-style-qa.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 135
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion-remotion/package-lock.json
      - name: Install FFmpeg and official serif text fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Install word boundary TTS + the official cover dependencies
        run: python -m pip install 'edge-tts>=7,<9' 'Pillow>=10,<13'
      - name: Install native AutoEditorVideo Remotion renderer
        working-directory: motion-remotion
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Reuse EXACT original six approved AI-art videos, no new image model calls
        uses: actions/download-artifact@v4
        with:
          name: games-alchemy-six-ai-render
          run-id: 42044136670
          github-token: ${{ github.token }}
          path: source-games-alchemy-six/
      - name: Render full six videos with creator-approved 5-second reference style
        env:
          REFERENCE_V4_APPROVED: 'true'
          SOURCE_RUN_ID: '42044136670'
        run: python scripts/games_alchemy_reference_v4.py --action render
      - name: Save all revised MP4s, original-program thumbnails, per-video QA and metadata
        uses: actions/upload-artifact@v4
        with:
          name: gamer-alchemy-reference-v4-six
          path: cloud-games-alchemy-reference-v4/
          retention-days: 7
          if-no-files-found: error

  upload-six-v4-private:
    needs: [offline-reference-style-qa, render-six-approved-v4]
    if: needs.render-six-approved-v4.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: games
            token_secret: YOUTUBE_GAMES_TOKEN_JSON
          - channel: alchemy
            token_secret: YOUTUBE_ALCHEMY_TOKEN_JSON
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install supported YouTube API client without reading OAuth secrets
        run: python -m pip install -r requirements-publicacao.txt
      - name: Reuse the six newly rendered, QA-checked V4 MP4s and covers
        uses: actions/download-artifact@v4
        with:
          name: gamer-alchemy-reference-v4-six
          path: cloud-games-alchemy-reference-v4/
      - name: Upload three V4 Shorts on exact destination channel as PRIVATE; wait 75s before official cover
        env:
          REFERENCE_V4_UPLOAD_APPROVED: 'true'
          SOURCE_REFERENCE_RENDER_RUN_ID: ${{ github.run_id }}
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.token_secret] }}
        run: python scripts/games_alchemy_reference_v4_upload.py --channel ${{ matrix.channel }}
      - name: Preserve all received YouTube IDs even on error; never retry video insert blindly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-v4-private-upload-receipts-${{ matrix.channel }}
          path: cloud-games-alchemy-reference-v4/${{ matrix.channel }}-native-v4-youtube-receipts.json
          retention-days: 7
          if-no-files-found: ignore
