name: Otaku Multicena BR - Preparar 1 Short em paralelo (sem publicar)
on:
  workflow_dispatch:
    inputs:
      number:
        description: 'Short de teste (22..26)'
        type: string
        required: true
      confirm_generation:
        description: 'Geracao apenas: NAO publicar no YouTube'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: otaku-br-prepare-one-${{ inputs.number }}
  cancel-in-progress: false

jobs:
  prepare-one:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      inputs.confirm_generation == true
    runs-on: ubuntu-24.04
    environment: image-generation
    timeout-minutes: 110
    permissions:
      contents: read
      actions: read
    env:
      EPISODE_NUMBER: ${{ inputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate experimental range and refuse published episodes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EPISODE_NUMBER" =~ ^(22|23|24|25|26)$ ]] || {
            echo "Refusing non-experiment episode."; exit 1;
          }
          n=$((6100 + 10#$EPISODE_NUMBER))
          if gh api "repos/$GITHUB_REPOSITORY/contents/dados/otaku-br-50-reverso-recibos/$n-multicena-experimento-novembro.json" --jq .sha >/dev/null 2>&1; then
            echo "Episode already has publication receipt; do not prepare again."
            exit 1
          fi
          python scripts/otaku_br_50_reverso.py --action validate >/dev/null
          echo "[PARALLEL] Preparing number=$EPISODE_NUMBER without any YouTube OAuth"
      - name: Confirm image-generation Environment restricted to main only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/image_env_policy_guard.py
      - name: Restore complete pre-rendered video across workflow runs
        id: prepared-cache
        uses: actions/cache/restore@v4
        with:
          path: assets/gerados/otaku-multicena-experimento-50/
          key: otaku-br-50-prepared-v1-${{ env.EPISODE_NUMBER }}-${{ hashFiles('scripts/otaku_br_50_generate_images.py', 'scripts/otaku_br_50_render.py', 'conteudos/otaku-multicena-br-50-inéditos-reverso-20261106.json', 'motion-remotion/src/**', 'motion-remotion/package-lock.json') }}
      - name: Fetch immutable pinned image provider BEFORE secrets
        if: steps.prepared-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: 10/chatgpt-codex-proxy
          ref: 1da5476e46ef62830d7016de2a931b0b8270a6c4
          path: pinned-native-go-proxy
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.prepared-cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-master.txt
      - uses: actions/setup-node@v4
        if: steps.prepared-cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion-remotion/package-lock.json
      - uses: actions/setup-go@v6
        if: steps.prepared-cache.outputs.cache-hit != 'true'
        with:
          go-version-file: pinned-native-go-proxy/go.mod
          cache: false
      - name: Restore cached FFmpeg and FFprobe
        if: steps.prepared-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/otaku-br-50/ffmpeg
          key: otaku-br-50-ffmpeg8-static-3.0-ubuntu24-x64-v1
      - name: Install Python dependencies and verify FFmpeg (no apt)
        if: steps.prepared-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-master.txt 'static-ffmpeg==3.0'
          python scripts/otaku_br_50_setup_media.py --dir .cache/otaku-br-50/ffmpeg
          echo "$GITHUB_WORKSPACE/.cache/otaku-br-50/ffmpeg" >> "$GITHUB_PATH"
          python -c 'import sys; sys.path.insert(0,"scripts"); from capa_cinematografica import load_font; assert load_font(22).getbbox("TESTE") is not None'
      - name: Restore Remotion dependencies
        if: steps.prepared-cache.outputs.cache-hit != 'true'
        id: remotion-cache
        uses: actions/cache@v4
        with:
          path: motion-remotion/node_modules
          key: otaku-br-50-remotion-ubuntu24-node22-${{ hashFiles('motion-remotion/package-lock.json') }}
      - name: Install Remotion only on cache miss
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.remotion-cache.outputs.cache-hit != 'true'
        working-directory: motion-remotion
        run: npm ci --no-audit --no-fund
      - name: Typecheck render before generation
        if: steps.prepared-cache.outputs.cache-hit != 'true'
        working-directory: motion-remotion
        run: npm run typecheck
      - name: Restore compiled pinned provider
        if: steps.prepared-cache.outputs.cache-hit != 'true'
        id: proxy-cache
        uses: actions/cache@v4
        with:
          path: .cache/otaku-br-50/proxy/otaku-native-proxy
          key: otaku-br-50-proxy-go1269-1da5476e-ubuntu24-v1-${{ hashFiles('pinned-native-go-proxy/go.sum') }}
      - name: Compile provider only when cache changes
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.proxy-cache.outputs.cache-hit != 'true'
        working-directory: pinned-native-go-proxy
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/otaku-br-50/proxy"
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/.cache/otaku-br-50/proxy/otaku-native-proxy" ./cmd/api
      - name: Generate FIVE images, voice, captions, MP4 and cover for this one Short
        if: steps.prepared-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          IMAGE_MODEL: gpt-image-2
          MAX_IMAGE_CALLS: '5'
          PROXY_ACCOUNTS_JSON: ${{ secrets.PROXY_ACCOUNTS_JSON }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -x .cache/otaku-br-50/proxy/otaku-native-proxy
          state_dir="$RUNNER_TEMP/otaku-50-image-private"
          mkdir -m 700 "$state_dir"
          proxy_pid=''
          cleanup() {
            if [[ -n "$proxy_pid" ]]; then kill "$proxy_pid" 2>/dev/null || true; fi
            rm -rf -- "$state_dir"
            rm -f "$RUNNER_TEMP/otaku-br-50-proxy.log"
          }
          trap cleanup EXIT
          python scripts/proxy_accounts_private_stage.py "$state_dir"
          unset PROXY_ACCOUNTS_JSON
          DATA_DIR="$state_dir" DEBUG_LOG_PAYLOADS=false GIN_MODE=release PORT=8080 \
            "$GITHUB_WORKSPACE/.cache/otaku-br-50/proxy/otaku-native-proxy" >"$RUNNER_TEMP/otaku-br-50-proxy.log" 2>&1 &
          proxy_pid=$!
          python scripts/otaku_br_50_generate_images.py --number "$EPISODE_NUMBER"
          python scripts/otaku_br_50_render.py --action render --number "$EPISODE_NUMBER"
      - name: Validate every generated MP4, cover, metadata and checksum
        run: python scripts/otaku_br_50_validate_prepared.py --number "$EPISODE_NUMBER"
      - name: Save complete pre-rendered Short for sequential publishing
        if: steps.prepared-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: assets/gerados/otaku-multicena-experimento-50/
          key: otaku-br-50-prepared-v1-${{ env.EPISODE_NUMBER }}-${{ hashFiles('scripts/otaku_br_50_generate_images.py', 'scripts/otaku_br_50_render.py', 'conteudos/otaku-multicena-br-50-inéditos-reverso-20261106.json', 'motion-remotion/src/**', 'motion-remotion/package-lock.json') }}
      - name: Preserve independent MP4, cover, captions and QA
        uses: actions/upload-artifact@v4
        with:
          name: otaku-br-50-parallel-${{ env.EPISODE_NUMBER }}
          path: assets/gerados/otaku-multicena-experimento-50/
          retention-days: 10
          if-no-files-found: error
