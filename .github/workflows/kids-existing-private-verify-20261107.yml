name: Emanuelly Kids - verify 3 existing private videos and recover cover

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/kids-existing-three-verify-20261107.json'

permissions:
  contents: read

concurrency:
  group: kids-existing-three-private-video-ids-verify-once-20261107
  cancel-in-progress: false

jobs:
  offline-contract:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'fix(kids): verify existing three YouTube video IDs without re-upload'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify ONLY the 3 accepted private IDs and no duplicate insert
        run: |
          python -m pip install 'Pillow>=10,<13' 'pytest>=8,<10'
          python -m py_compile scripts/kids_static_90s_verify_existing_20261107.py
          python -m pytest -q tests/test_kids_static_90s_20261107.py tests/test_kids_upload_recovery_20261107.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('conteudos/kids-existing-three-verify-20261107.json').read_text(encoding='utf-8'))
          assert d=={
            'schema':'autoeditorvideo/kids-three-existing-only-check/v1',
            'source_render_run':42393346725,
            'first_upload_run':42396417881,
            'source_artifact':'emanuelly-kids-static-three-mp4-20261107',
            'channel_id':'UCxEzVW2Uy44OUVurTQSg_Eg',
            'video_ids':['d7hjFP6Ky6w','ax0ude5BUhE','It-7R1o9k7Q'],
            'scope':'read_only_status_plus_cover_for_third',
            'new_video_uploads':False,
            'new_ai_images':False,
            'privacy':'private',
            'made_for_kids':True,
            'no_fofinhos':True
          }
          code=Path('scripts/kids_static_90s_verify_existing_20261107.py').read_text(encoding='utf-8')
          assert 'videos().insert(' not in code
          assert 'videos().update(' not in code
          assert 'videos().delete(' not in code
          print('KIDS_THREE_EXISTING_ONLY_NO_REUPLOAD_GUARD_PASSED')
          PY

  environment-guard:
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify shared YouTube Environment is protected main-only without OAuth
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os
          from youtube_new_channels_env_guard import fetch_protected_policy,policy_is_main_only
          env,policies=fetch_protected_policy('kids',os.environ.get('GH_TOKEN',''))
          policy_is_main_only('kids',env,policies)
          print('KIDS_EXISTING_VIDEO_VERIFY_MAIN_ONLY_PROTECTION_PASSED')
          PY

  verify-existing-three:
    needs: [offline-contract, environment-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google API and verify media dependencies without image-generation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Download ORIGINAL 3 rendered MP4s and covers with SHA256 QA
        uses: actions/download-artifact@v4
        with:
          name: emanuelly-kids-static-three-mp4-20261107
          run-id: 42393346725
          github-token: ${{ github.token }}
          path: cloud-kids-static-20261107/
      - name: Query 3 known IDs only; repair third thumbnail, never videos.insert
        env:
          KIDS_EXISTING_ONLY_APPROVED: 'yes'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_KIDS_TOKEN_JSON }}
        run: python scripts/kids_static_90s_verify_existing_20261107.py
      - name: Preserve read-only verified YouTube IDs and cover status even on error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emanuelly-kids-existing-three-private-verification-20261107
          path: cloud-kids-static-20261107/kids-existing-3-video-verification.json
          retention-days: 7
          if-no-files-found: ignore
