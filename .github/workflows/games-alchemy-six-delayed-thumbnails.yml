name: Gamer + Alchemy - delayed thumbnail retry for six private Shorts

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/games-alchemy-six-thumbnail-retry-20261105.json'

permissions:
  contents: read

concurrency:
  group: games-alchemy-thumbnail-only-six-once-20261105
  cancel-in-progress: false

jobs:
  verify-exact-existing-six-shorts:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'feat(thumbnail): retry existing six private Shorts covers after delay'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check original render and upload receipts, main-only Environment, no secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/games_alchemy_delayed_thumbnail_gate.py
      - name: Syntax validate thumbnail-only uploader before secrets
        run: python -m py_compile scripts/games_alchemy_delayed_thumbnail_retry.py scripts/games_alchemy_ai_upload.py

  retry-gamer-thumbnails:
    needs: verify-exact-existing-six-shorts
    if: needs.verify-exact-existing-six-shorts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YouTube libraries and PIL without secrets
        run: python -m pip install -r requirements-publicacao.txt
      - uses: actions/download-artifact@v4
        with:
          name: games-alchemy-six-ai-render
          run-id: 42044136670
          github-token: ${{ github.token }}
          path: cloud-games-alchemy-ai-six/
      - name: Wait after upload and retry only three existing Gamer covers (no videos.insert)
        env:
          DELAYED_THUMBNAIL_RETRY_APPROVED: 'true'
          SOURCE_RENDER_RUN_ID: '42044136670'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_GAMES_TOKEN_JSON }}
        run: python scripts/games_alchemy_delayed_thumbnail_retry.py --channel games
      - name: Save thumbnail API result even if YouTube rejects them
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-gamer-delayed-thumbnail-receipts
          path: cloud-games-alchemy-ai-six/games/delayed-thumbnail-retry-receipts.json
          retention-days: 7
          if-no-files-found: warn

  retry-alchemy-thumbnails:
    needs: verify-exact-existing-six-shorts
    if: needs.verify-exact-existing-six-shorts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YouTube libraries and PIL without secrets
        run: python -m pip install -r requirements-publicacao.txt
      - uses: actions/download-artifact@v4
        with:
          name: games-alchemy-six-ai-render
          run-id: 42044136670
          github-token: ${{ github.token }}
          path: cloud-games-alchemy-ai-six/
      - name: Wait after upload and retry only three existing Alchemy covers (no videos.insert)
        env:
          DELAYED_THUMBNAIL_RETRY_APPROVED: 'true'
          SOURCE_RENDER_RUN_ID: '42044136670'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_ALCHEMY_TOKEN_JSON }}
        run: python scripts/games_alchemy_delayed_thumbnail_retry.py --channel alchemy
      - name: Save thumbnail API result even if YouTube rejects them
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-alchemy-delayed-thumbnail-receipts
          path: cloud-games-alchemy-ai-six/alchemy/delayed-thumbnail-retry-receipts.json
          retention-days: 7
          if-no-files-found: warn
