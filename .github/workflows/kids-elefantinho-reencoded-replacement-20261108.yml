name: Emanuelly Kids - recover stuck Elefantinho public processed replacement
on:
  push:
    branches: [main]
    paths:
      - 'conteudos/kids-elefantinho-reencoded-replacement-launch-20261108.json'
permissions:
  contents: read
concurrency:
  group: kids-elefantinho-replace-stuck-P0D-once-20261108
  cancel-in-progress: false
jobs:
  offline-one-kids-only-guard:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'fix(kids): launch safe reencode and public replacement of stuck Elefantinho'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate one-video source/strict child audience and no deletion or other channels
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m py_compile scripts/kids_elefantinho_stuck_replacement_20261108.py
          python scripts/kids_elefantinho_stuck_replacement_20261108.py --action preflight
          python - <<'PY'
          from pathlib import Path
          src=Path('scripts/kids_elefantinho_stuck_replacement_20261108.py').read_text()
          assert 'OLD_ID="d7hjFP6Ky6w"' in src
          assert 'EXPECTED_SOURCE_SHA="a886f63c89b7def376e8d08e4e9b6d899670a99c277ecd8c30554592c2d4661f"' in src
          assert '"selfDeclaredMadeForKids":True' in src
          assert '"privacyStatus":"public"' in src
          assert 'num_retries=0' in src
          assert 'if present:' in src
          assert 'reencode()' in src
          assert 'videos().delete(' not in src
          assert 'videos().update(' not in src
          assert 'request_image(' not in src
          print('ONE_KIDS_ONLY_NO_OTHER_VIDEO_TOUCH_APPROVED')
          PY
      - name: Confirm protected shared Youtube Environment main-only without credentials
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os
          from youtube_new_channels_env_guard import fetch_protected_policy,policy_is_main_only
          policy,branches=fetch_protected_policy('kids',os.environ['GH_TOKEN'])
          policy_is_main_only('kids',policy,branches)
          print('KIDS_PRIVATE_OAUTH_ENV_PROTECTED')
          PY
  reencode-one-and-send-public:
    needs: offline-one-kids-only-guard
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google YouTube API and ffmpeg H264/AAC encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Reuse exact prior three MP4 artifact without regenerating any images
        uses: actions/download-artifact@v4
        with:
          name: emanuelly-kids-static-three-mp4-20261107
          run-id: 42393346725
          github-token: ${{ github.token }}
          path: cloud-kids-static-20261107/
      - name: Reencode Elefantinho source H.264/AAC faststart, check old stuck P0D, public upload only new one
        env:
          KIDS_ELEFANTINHO_REPLACE_APPROVED: 'yes'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_KIDS_TOKEN_JSON }}
        run: python scripts/kids_elefantinho_stuck_replacement_20261108.py --action upload
      - name: Retain exact old/new Kids video ID and processing status even if future failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-elefantinho-public-reencoded-replacement-receipt-20261108
          path: kids-elefantinho-reencoded-replacement-20261108/kids-elefantinho-replacement-result.json
          retention-days: 7
          if-no-files-found: ignore
