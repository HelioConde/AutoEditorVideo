name: Fluxo unico - video completo e publicacao YouTube
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fluxo_unico_short.py'
      - 'scripts/agendar_24_shorts.py'
      - 'scripts/publicar_arquivo_otaku.py'
      - 'scripts/publicar_recap_hourly.py'
      - 'scripts/roteiro_para_storyboard.py'
      - 'scripts/metadata_shorts.py'
      - 'conteudos/death-note-recaps-60s.json'
      - 'conteudos/lote-24-shorts.json'
      - 'conteudos/death-note-formatos-60s.json'
      - 'tests/test_fluxo_unico_short.py'
      - 'tests/test_agendar_24_shorts.py'
      - 'tests/test_publicar_recap_hourly.py'
      - 'criar-publicar-short.ps1'
      - 'programar-24-shorts.ps1'
      - 'programar-24-shorts.cmd'
      - 'publicar-youtube.ps1'
      - 'publicar-recaps-por-hora.ps1'
      - '.github/workflows/fluxo-unico-shorts.yml'
  pull_request:
    paths:
      - 'scripts/fluxo_unico_short.py'
      - 'scripts/agendar_24_shorts.py'
      - 'scripts/publicar_arquivo_otaku.py'
      - 'scripts/publicar_recap_hourly.py'
      - 'scripts/roteiro_para_storyboard.py'
      - 'scripts/metadata_shorts.py'
      - 'conteudos/death-note-recaps-60s.json'
      - 'conteudos/lote-24-shorts.json'
      - 'conteudos/death-note-formatos-60s.json'
      - 'tests/test_fluxo_unico_short.py'
      - 'tests/test_agendar_24_shorts.py'
      - 'tests/test_publicar_recap_hourly.py'
      - 'criar-publicar-short.ps1'
      - 'programar-24-shorts.ps1'
      - 'programar-24-shorts.cmd'
      - 'publicar-youtube.ps1'
      - 'publicar-recaps-por-hora.ps1'
      - '.github/workflows/fluxo-unico-shorts.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10' 'Pillow>=10,<13' 'numpy>=1.24,<3' 'requests>=2.31,<3'
      - name: Validate recaps, curiosity, nostalgia, hourly cycle and upload safety
        run: python -m pytest -q tests/test_fluxo_unico_short.py tests/test_publicar_recap_hourly.py tests/test_agendar_24_shorts.py tests/test_shorts_duration.py tests/test_voice_before_approval.py
