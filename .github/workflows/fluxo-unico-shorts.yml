name: Fluxo unico - video completo e publicacao YouTube
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fluxo_unico_short.py'
      - 'scripts/roteiro_para_storyboard.py'
      - 'scripts/metadata_shorts.py'
      - 'conteudos/death-note-recaps-60s.json'
      - 'tests/test_fluxo_unico_short.py'
      - 'criar-publicar-short.ps1'
      - '.github/workflows/fluxo-unico-shorts.yml'
  pull_request:
    paths:
      - 'scripts/fluxo_unico_short.py'
      - 'scripts/roteiro_para_storyboard.py'
      - 'scripts/metadata_shorts.py'
      - 'conteudos/death-note-recaps-60s.json'
      - 'tests/test_fluxo_unico_short.py'
      - 'criar-publicar-short.ps1'
      - '.github/workflows/fluxo-unico-shorts.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10' 'Pillow>=10,<13' 'numpy>=1.24,<3' 'requests>=2.31,<3'
      - name: Validate 3 recaps, recovery, distinct metadata and upload safety
        run: python -m pytest -q tests/test_fluxo_unico_short.py tests/test_shorts_duration.py tests/test_voice_before_approval.py
