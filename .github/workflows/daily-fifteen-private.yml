name: AutoEditorVideo - lote diario 15 Shorts privados

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/lotes-diarios/*.json'
      - 'conteudos/recuperacoes/2026-11-10-from-42936085393.json'
      - 'conteudos/recuperacoes/2026-11-10-br-only-from-42948724879.json'
      - 'conteudos/recuperacoes/2026-11-10-br-scene-cache-from-42954205755.json'

permissions:
  contents: read

concurrency:
  group: daily-fifteen-unique-private-main
  cancel-in-progress: false

jobs:
  editorial-preflight:
    outputs:
      batch_date: ${{ steps.detect.outputs.batch_date }}
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'feat(batch15): launch daily ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: detect
        name: Require exactly one new dated manuscript, authorized by creator
        shell: bash
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only HEAD^ HEAD -- 'conteudos/lotes-diarios/*.json')
          if [[ ${#files[@]} -ne 1 ]]; then echo 'ONE_NEW_MANIFEST_COMMIT_REQUIRED'; exit 1; fi
          file="${files[0]}"
          day="$(basename "$file" .json)"
          if [[ ! "$day" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then echo 'INVALID_BATCH_DAY'; exit 1; fi
          if [[ "$HEAD_MESSAGE" != "feat(batch15): launch daily $day private" ]]; then echo 'EXPLICIT_BATCH_LAUNCH_COMMIT_REQUIRED'; exit 1; fi
          echo "batch_date=$day" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact 15 new reserved stories and original pipeline
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'Pillow>=10,<13'
          python -m py_compile scripts/daily_fifteen.py scripts/five_channel_fifteen_20261108.py scripts/five_channel_fifteen_upload_20261108.py
          for channel in br en games kids alchemy; do
            python scripts/daily_fifteen.py --date "${{ steps.detect.outputs.batch_date }}" --channel "$channel" --action validate
          done

  verify-image-environment:
    needs: editorial-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce protected image-generation Environment restricted to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/image_env_policy_guard.py

  verify-youtube-environment:
    needs: editorial-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce protected youtube-private-upload Environment restricted to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/youtube_env_policy_guard.py

  render:
    needs: [editorial-preflight, verify-image-environment]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: [br, en, games, kids, alchemy]
    runs-on: ubuntu-24.04
    timeout-minutes: 245
    environment: image-generation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned native image provider proxy
        uses: actions/checkout@v4
        with:
          repository: 10/chatgpt-codex-proxy
          ref: 1da5476e46ef62830d7016de2a931b0b8270a6c4
          path: pinned-native-go-proxy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion-remotion/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: pinned-native-go-proxy/go.mod
          cache: false
      - name: Install original AutoEditorVideo media toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-master.txt 'edge-tts>=7,<9' 'Pillow>=10,<13'
      - name: Compile original canonical Remotion renderer
        working-directory: motion-remotion
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Compile pinned native image proxy before loading image credentials
        working-directory: pinned-native-go-proxy
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/nov09-native-proxy" ./cmd/api
      - name: Render 3 distinct original videos with gpt-image-2
        shell: bash
        env:
          PROXY_ACCOUNTS_JSON: ${{ secrets.PROXY_ACCOUNTS_JSON }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
          IMAGE_MODEL: gpt-image-2
          BATCH15_CHANNEL: ${{ matrix.channel }}
          BATCH15_RENDER_AUTHORIZED: 'yes'
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/nov09-${BATCH15_CHANNEL}-proxy"
          mkdir -m 700 "$private_dir"
          proxy_pid=''
          cleanup() {
            if [[ -n "$proxy_pid" ]]; then kill "$proxy_pid" 2>/dev/null || true; fi
            rm -rf -- "$private_dir"
            rm -f -- "$RUNNER_TEMP/nov09-${BATCH15_CHANNEL}-proxy.log"
          }
          trap cleanup EXIT
          python scripts/proxy_accounts_private_stage.py "$private_dir"
          unset PROXY_ACCOUNTS_JSON
          DATA_DIR="$private_dir" DEBUG_LOG_PAYLOADS=false GIN_MODE=release PORT=8080 \
            "$RUNNER_TEMP/nov09-native-proxy" >"$RUNNER_TEMP/nov09-${BATCH15_CHANNEL}-proxy.log" 2>&1 &
          proxy_pid=$!
          python scripts/daily_fifteen.py --date "${{ needs.editorial-preflight.outputs.batch_date }}" --channel "$BATCH15_CHANNEL" --action render
          echo "DAILY_RENDER_THREE_COMPLETED_${BATCH15_CHANNEL}"
      - name: Preserve original MP4s, official covers, storyboard and technical QA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daily-${{ needs.editorial-preflight.outputs.batch_date }}-three-original-media-${{ matrix.channel }}
          path: |
            cloud-lote-15-diario-${{ needs.editorial-preflight.outputs.batch_date }}/${{ matrix.channel }}/summary.json
            cloud-lote-15-diario-${{ needs.editorial-preflight.outputs.batch_date }}/${{ matrix.channel }}/**/final.mp4
            cloud-lote-15-diario-${{ needs.editorial-preflight.outputs.batch_date }}/${{ matrix.channel }}/**/thumb.jpg
            cloud-lote-15-diario-${{ needs.editorial-preflight.outputs.batch_date }}/${{ matrix.channel }}/**/qa.json
            cloud-lote-15-diario-${{ needs.editorial-preflight.outputs.batch_date }}/${{ matrix.channel }}/**/metadata.json
            cloud-lote-15-diario-${{ needs.editorial-preflight.outputs.batch_date }}/${{ matrix.channel }}/**/scene-*.png
          retention-days: 7
          if-no-files-found: error

  upload-private:
    needs: [editorial-preflight, verify-youtube-environment, render]
    if: >-
      needs.editorial-preflight.result == 'success' &&
      needs.verify-youtube-environment.result == 'success' &&
      needs.render.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - channel: br
            token_secret: YOUTUBE_BR_TOKEN_JSON
          - channel: en
            token_secret: YOUTUBE_EN_TOKEN_JSON
          - channel: games
            token_secret: YOUTUBE_GAMES_TOKEN_JSON
          - channel: kids
            token_secret: YOUTUBE_KIDS_TOKEN_JSON
          - channel: alchemy
            token_secret: YOUTUBE_ALCHEMY_TOKEN_JSON
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: youtube-private-upload
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original YouTube upload and technical validation libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Download exact three original MP4s from this GitHub Action run
        uses: actions/download-artifact@v4
        with:
          name: daily-${{ needs.editorial-preflight.outputs.batch_date }}-three-original-media-${{ matrix.channel }}
          path: cloud-lote-15-diario-${{ needs.editorial-preflight.outputs.batch_date }}/${{ matrix.channel }}/
      - name: Verify channel OAuth and insert only previously absent original videos PRIVATELY
        env:
          BATCH15_CHANNEL: ${{ matrix.channel }}
          BATCH15_PRIVATE_UPLOAD_AUTHORIZED: 'yes'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.token_secret] }}
        run: python scripts/daily_fifteen.py --date "${{ needs.editorial-preflight.outputs.batch_date }}" --channel "${{ matrix.channel }}" --action upload
      - name: Preserve verified IDs or partial receipts without exposing credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-${{ needs.editorial-preflight.outputs.batch_date }}-private-youtube-receipts-${{ matrix.channel }}
          path: cloud-lote-15-diario-${{ needs.editorial-preflight.outputs.batch_date }}/${{ matrix.channel }}/youtube-private-receipts.json
          retention-days: 7
          if-no-files-found: ignore


  recovery-preflight:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'fix(batch15): recover 2026-11-10 privately from run 42936085393'
    outputs:
      batch_date: ${{ steps.confirm.outputs.batch_date }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: confirm
        name: Require single newly authorized recovery manifest and original failed run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker=conteudos/recuperacoes/2026-11-10-from-42936085393.json
          test "$(git diff --name-status HEAD^ HEAD)" = "$(printf 'A\t%s' "$marker")" || { echo "EXACT_NEW_RECOVERY_MARKER_REQUIRED"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("conteudos/recuperacoes/2026-11-10-from-42936085393.json")
          got=json.loads(p.read_text(encoding="utf-8"))
          expected={
            "schema":"autoeditorvideo/private-recovery/v1",
            "batch_date":"2026-11-10",
            "source_run_id":42936085393,
            "source_commit_sha":"d888999d798c1ca769f3b9f49ccce5b8379a0007",
            "reuse_successful_artifacts":["en","games","alchemy"],
            "render_missing_artifacts":["br","kids"],
            "upload_visibility":"private",
            "kids_made_for_kids":True,
            "public_publication_approved":False,
            "creator_authorized_recovery":True
          }
          assert got==expected,"RECOVERY_CONTRACT_MISMATCH"
          PY
          state="$(gh api repos/HelioConde/AutoEditorVideo/actions/runs/42936085393 --jq '.status + " " + .conclusion + " " + .head_sha')"
          test "$state" = "completed failure d888999d798c1ca769f3b9f49ccce5b8379a0007" || { echo "ORIGINAL_RUN_NOT_FAILED_AS_EXPECTED"; exit 1; }
          found="$(gh api 'repos/HelioConde/AutoEditorVideo/actions/runs/42936085393/artifacts?per_page=100' --jq '.artifacts[] | select(.expired == false) | .name')"
          for ch in en games alchemy; do
            printf '%s\n' "$found" | grep -Fqx "daily-2026-11-10-three-original-media-$ch" || { echo "ORIGINAL_ARTIFACT_MISSING_$ch"; exit 1; }
          done
          echo "batch_date=2026-11-10" >> "$GITHUB_OUTPUT"
          echo "RECOVERY_FROM_FAILED_RUN_AND_EXISTING_ARTIFACTS_CONFIRMED"
      - name: Validate all exact fifteen episode reservations, Kids audience and private intent
        run: |
          set -euo pipefail
          python -m pip install 'Pillow>=10,<13'
          python -m py_compile scripts/daily_fifteen.py scripts/five_channel_fifteen_20261108.py scripts/five_channel_fifteen_upload_20261108.py scripts/remaining_static_90s_20261107.py
          for ch in br en games kids alchemy; do
            python scripts/daily_fifteen.py --date 2026-11-10 --channel "$ch" --action validate
          done

  recovery-verify-image-environment:
    needs: recovery-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check protected image-generation environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/image_env_policy_guard.py

  recovery-verify-youtube-environment:
    needs: recovery-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check protected private YouTube environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/youtube_env_policy_guard.py

  recovery-render:
    needs: [recovery-preflight, recovery-verify-image-environment]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: [br, kids]
    runs-on: ubuntu-24.04
    timeout-minutes: 245
    environment: image-generation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned native image provider proxy
        uses: actions/checkout@v4
        with:
          repository: 10/chatgpt-codex-proxy
          ref: 1da5476e46ef62830d7016de2a931b0b8270a6c4
          path: pinned-native-go-proxy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion-remotion/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: pinned-native-go-proxy/go.mod
          cache: false
      - name: Install original AutoEditorVideo media toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-master.txt 'edge-tts>=7,<9' 'Pillow>=10,<13'
      - name: Compile original canonical Remotion renderer
        working-directory: motion-remotion
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Compile pinned native image proxy before loading image credentials
        working-directory: pinned-native-go-proxy
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/nov09-native-proxy" ./cmd/api
      - name: Render 3 distinct original videos with gpt-image-2
        shell: bash
        env:
          PROXY_ACCOUNTS_JSON: ${{ secrets.PROXY_ACCOUNTS_JSON }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
          IMAGE_MODEL: gpt-image-2
          BATCH15_CHANNEL: ${{ matrix.channel }}
          BATCH15_RENDER_AUTHORIZED: 'yes'
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/nov09-${BATCH15_CHANNEL}-proxy"
          mkdir -m 700 "$private_dir"
          proxy_pid=''
          cleanup() {
            if [[ -n "$proxy_pid" ]]; then kill "$proxy_pid" 2>/dev/null || true; fi
            rm -rf -- "$private_dir"
            rm -f -- "$RUNNER_TEMP/nov09-${BATCH15_CHANNEL}-proxy.log"
          }
          trap cleanup EXIT
          python scripts/proxy_accounts_private_stage.py "$private_dir"
          unset PROXY_ACCOUNTS_JSON
          DATA_DIR="$private_dir" DEBUG_LOG_PAYLOADS=false GIN_MODE=release PORT=8080 \
            "$RUNNER_TEMP/nov09-native-proxy" >"$RUNNER_TEMP/nov09-${BATCH15_CHANNEL}-proxy.log" 2>&1 &
          proxy_pid=$!
          python scripts/daily_fifteen.py --date "${{ needs.recovery-preflight.outputs.batch_date }}" --channel "$BATCH15_CHANNEL" --action render
          echo "DAILY_RENDER_THREE_COMPLETED_${BATCH15_CHANNEL}"
      - name: Preserve original MP4s, official covers, storyboard and technical QA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daily-${{ needs.recovery-preflight.outputs.batch_date }}-three-original-media-${{ matrix.channel }}
          path: |
            cloud-lote-15-diario-${{ needs.recovery-preflight.outputs.batch_date }}/${{ matrix.channel }}/summary.json
            cloud-lote-15-diario-${{ needs.recovery-preflight.outputs.batch_date }}/${{ matrix.channel }}/**/final.mp4
            cloud-lote-15-diario-${{ needs.recovery-preflight.outputs.batch_date }}/${{ matrix.channel }}/**/thumb.jpg
            cloud-lote-15-diario-${{ needs.recovery-preflight.outputs.batch_date }}/${{ matrix.channel }}/**/qa.json
            cloud-lote-15-diario-${{ needs.recovery-preflight.outputs.batch_date }}/${{ matrix.channel }}/**/metadata.json
            cloud-lote-15-diario-${{ needs.recovery-preflight.outputs.batch_date }}/${{ matrix.channel }}/**/scene-*.png
          retention-days: 7
          if-no-files-found: error

      - name: Preserve partial recovery output for diagnosis only, never upload
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-2026-11-10-incomplete-not-for-upload-${{ matrix.channel }}
          path: |
            cloud-lote-15-diario-2026-11-10/${{ matrix.channel }}/**/scene-*.png
            cloud-lote-15-diario-2026-11-10/${{ matrix.channel }}/**/qa.json
            cloud-lote-15-diario-2026-11-10/${{ matrix.channel }}/**/metadata.json
          retention-days: 3
          if-no-files-found: ignore

  recovery-upload-existing:
    needs: [recovery-preflight, recovery-verify-youtube-environment]
    if: >-
      needs.recovery-preflight.result == 'success' &&
      needs.recovery-verify-youtube-environment.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - channel: en
            token_secret: YOUTUBE_EN_TOKEN_JSON
          - channel: games
            token_secret: YOUTUBE_GAMES_TOKEN_JSON
          - channel: alchemy
            token_secret: YOUTUBE_ALCHEMY_TOKEN_JSON
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original YouTube upload and technical validation libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Reuse exact three successful original MP4s from failed source run
        uses: actions/download-artifact@v4
        with:
          name: daily-${{ needs.recovery-preflight.outputs.batch_date }}-three-original-media-${{ matrix.channel }}
          run-id: 42936085393
          github-token: ${{ github.token }}
          path: cloud-lote-15-diario-${{ needs.recovery-preflight.outputs.batch_date }}/${{ matrix.channel }}/
      - name: Verify channel OAuth and insert only previously absent original videos PRIVATELY
        env:
          BATCH15_CHANNEL: ${{ matrix.channel }}
          BATCH15_PRIVATE_UPLOAD_AUTHORIZED: 'yes'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.token_secret] }}
        run: python scripts/daily_fifteen.py --date "${{ needs.recovery-preflight.outputs.batch_date }}" --channel "${{ matrix.channel }}" --action upload
      - name: Preserve verified IDs or partial receipts without exposing credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-${{ needs.recovery-preflight.outputs.batch_date }}-private-youtube-receipts-${{ matrix.channel }}
          path: cloud-lote-15-diario-${{ needs.recovery-preflight.outputs.batch_date }}/${{ matrix.channel }}/youtube-private-receipts.json
          retention-days: 7
          if-no-files-found: ignore

  recovery-upload-new:
    needs: [recovery-preflight, recovery-verify-youtube-environment, recovery-render]
    if: >-
      always() &&
      needs.recovery-preflight.result == 'success' &&
      needs.recovery-verify-youtube-environment.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - channel: br
            token_secret: YOUTUBE_BR_TOKEN_JSON
          - channel: kids
            token_secret: YOUTUBE_KIDS_TOKEN_JSON
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: youtube-private-upload
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original YouTube upload and technical validation libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Download exact three newly recovered originals from this recovery run
        uses: actions/download-artifact@v4
        with:
          name: daily-${{ needs.recovery-preflight.outputs.batch_date }}-three-original-media-${{ matrix.channel }}
          path: cloud-lote-15-diario-${{ needs.recovery-preflight.outputs.batch_date }}/${{ matrix.channel }}/
      - name: Verify channel OAuth and insert only previously absent original videos PRIVATELY
        env:
          BATCH15_CHANNEL: ${{ matrix.channel }}
          BATCH15_PRIVATE_UPLOAD_AUTHORIZED: 'yes'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.token_secret] }}
        run: python scripts/daily_fifteen.py --date "${{ needs.recovery-preflight.outputs.batch_date }}" --channel "${{ matrix.channel }}" --action upload
      - name: Preserve verified IDs or partial receipts without exposing credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-${{ needs.recovery-preflight.outputs.batch_date }}-private-youtube-receipts-${{ matrix.channel }}
          path: cloud-lote-15-diario-${{ needs.recovery-preflight.outputs.batch_date }}/${{ matrix.channel }}/youtube-private-receipts.json
          retention-days: 7
          if-no-files-found: ignore


  br-only-preflight:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'fix(batch15): recover BR only 2026-11-10 privately from 42948724879'
    outputs:
      batch_date: ${{ steps.confirm.outputs.batch_date }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: confirm
        name: Require unique BR recovery authorization and four verified existing channel receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
