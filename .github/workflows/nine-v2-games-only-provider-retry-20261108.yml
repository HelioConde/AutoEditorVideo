name: AutoEditorVideo - retry Gamer-only V2 after exact failed original render
on:
  workflow_run:
    workflows:
      - AutoEditorVideo - nine image-corrected replacements EN Gamer Alchemy
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: gamer-v2-only-retry-source-run-42449154499-one-shot
  cancel-in-progress: false
jobs:
  validate-failed-gamer-run-and-bounded-retry:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.id == 42449154499 &&
      github.event.workflow_run.head_sha == '0841f7523e5a50bb48ab4f6399cd95350a82a36a' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove EXACT 3 Gamer v2 episodes, no Kids, no Otaku BR and only bounded image edits
        run: |
          python -m pip install 'pytest>=8,<10' 'Pillow>=10,<13'
          python -m py_compile scripts/nine_visual_replacements_v2_20261108.py scripts/nine_visual_replacements_v2_upload_20261108.py
          python -m pytest -q tests/test_nine_visual_replacements_v2_20261108.py
          python scripts/nine_visual_replacements_v2_20261108.py --channel games --action validate
          python scripts/nine_visual_replacements_v2_upload_20261108.py --channel games --action preflight
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/nine_visual_replacements_v2_20261108.py').read_text()
          assert 'RETRY_WORKFLOW="AutoEditorVideo - retry Gamer-only V2 after exact failed original render"' in p
          assert 'source.get("id")==42449154499' in p
          assert 'retry_budget=[6]' in p
          assert 'scene_engine.request_edit=retry_if_transient' in p
          assert 'request_image(' not in p
          print('GAMER_V2_ONLY_BOUNDED_REF_IMAGE_RETRIES_APPROVED')
          PY
      - name: Verify main-only protected image-generation Environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/image_env_policy_guard.py
  rerender-only-three-gamer-shorts:
    needs: validate-failed-gamer-run-and-bounded-retry
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: image-generation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned original Go proxy
        uses: actions/checkout@v4
        with:
          repository: 10/chatgpt-codex-proxy
          ref: 1da5476e46ef62830d7016de2a931b0b8270a6c4
          path: pinned-native-go-proxy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion-remotion/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: pinned-native-go-proxy/go.mod
          cache: false
      - name: Install canonical voice and MP4 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-master.txt 'edge-tts>=7,<9' 'Pillow>=10,<13'
      - name: Compile original Remotion from pinned lockfile
        working-directory: motion-remotion
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Compile Go proxy without any provider secrets
        working-directory: pinned-native-go-proxy
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/games-only-v2-proxy" ./cmd/api
      - name: Render only three Gamer Shorts with bounded same-anchor-reference edit retries
        shell: bash
        env:
          PROXY_ACCOUNTS_JSON: ${{ secrets.PROXY_ACCOUNTS_JSON }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
          IMAGE_MODEL: gpt-image-2
          MAX_IMAGE_CALLS: '33'
          V2_REPLACEMENTS_RENDER_APPROVED: 'yes'
          REPLACEMENTS_RETRY_APPROVED: 'yes'
          REPLACEMENTS_CHANNEL: games
        run: |
          set -euo pipefail
          umask 077
          state="$RUNNER_TEMP/games-v2-only-retry-proxy-state"
          test ! -e "$state"
          mkdir -m 700 "$state"
          pid=''
          cleanup() {
            if [[ -n "$pid" ]]; then kill "$pid" 2>/dev/null || true; fi
            rm -rf -- "$state"
            rm -f -- "$RUNNER_TEMP/games-v2-only-proxy.log"
          }
          trap cleanup EXIT
          python scripts/proxy_accounts_private_stage.py "$state"
          unset PROXY_ACCOUNTS_JSON
          DATA_DIR="$state" DEBUG_LOG_PAYLOADS=false GIN_MODE=release PORT=8080 \
            "$RUNNER_TEMP/games-only-v2-proxy" >"$RUNNER_TEMP/games-v2-only-proxy.log" 2>&1 &
          pid=$!
          python scripts/nine_visual_replacements_v2_20261108.py --channel games --action render
      - name: Save only three newly rendered Gamer v2 MP4s and original scene images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nine-replacements-visual-v2-games-review-20261108
          path: |
            cloud-nine-visual-replacements-v2-20261108/games/summary.json
            cloud-nine-visual-replacements-v2-20261108/games/**/final.mp4
            cloud-nine-visual-replacements-v2-20261108/games/**/thumb.jpg
            cloud-nine-visual-replacements-v2-20261108/games/**/qa.json
            cloud-nine-visual-replacements-v2-20261108/games/**/metadata.json
            cloud-nine-visual-replacements-v2-20261108/games/**/character-identity-provenance.json
            cloud-nine-visual-replacements-v2-20261108/games/**/anchor-*.png
            cloud-nine-visual-replacements-v2-20261108/games/**/scene-*.png
          retention-days: 7
          if-no-files-found: error
  stage-only-gamer-v2-private:
    needs: rerender-only-three-gamer-shorts
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Google API, ffprobe and image integrity dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Download ONLY the three successful Gamer replacement videos from SAME recovery run
        uses: actions/download-artifact@v4
        with:
          name: nine-replacements-visual-v2-games-review-20261108
          path: cloud-nine-visual-replacements-v2-20261108/games/
      - name: Verify channel identity, art provenance and all three private upload IDs without duplicating
        env:
          REPLACEMENTS_PRIVATE_STAGE_APPROVED: 'yes'
          REPLACEMENTS_RETRY_APPROVED: 'yes'
          REPLACEMENTS_CHANNEL: games
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_GAMES_TOKEN_JSON }}
        run: python scripts/nine_visual_replacements_v2_upload_20261108.py --channel games --action upload
      - name: Preserve only Gamer v2 real YouTube IDs and private visibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nine-v2-games-private-replacement-receipts-20261108
          path: cloud-nine-visual-replacements-v2-20261108/games/youtube-v2-private-upload-receipts.json
          retention-days: 7
          if-no-files-found: ignore
