name: New Channels - Verify YouTube OAuth (Games Kids Alchemy) READ ONLY

on:
  pull_request:
    paths:
      - '.github/workflows/youtube-new-channels-oauth.yml'
      - 'scripts/youtube_new_channels_oauth.py'
      - 'scripts/youtube_new_channels_env_guard.py'
      - 'tests/test_youtube_new_channels_oauth.py'
      - 'conectar-novos-canais.ps1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/youtube-new-channels-oauth.yml'
      - 'scripts/youtube_new_channels_oauth.py'
      - 'scripts/youtube_new_channels_env_guard.py'
      - 'tests/test_youtube_new_channels_oauth.py'
      - 'conectar-novos-canais.ps1'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Read-only verification of one selected channel in the shared main-only Environment. NEVER upload.'
        type: choice
        required: true
        default: games
        options:
          - games
          - kids
          - alchemy

permissions:
  contents: read

concurrency:
  group: new-youtube-oauth-readonly-${{ github.event_name }}-${{ github.event.inputs.channel || 'ci' }}
  cancel-in-progress: false

jobs:
  offline-safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic testing dependencies, NO real credentials
        run: python -m pip install 'pytest>=8,<10'
      - name: Test OAuth identities, Kids isolation and Environment protection
        run: python -m pytest -q tests/test_youtube_new_channels_oauth.py tests/test_youtube_channel_registry.py
      - name: Report registered channels without OAuth calls
        run: python scripts/youtube_channel_registry.py --action list

  powershell-syntax-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse connector PowerShell without running OAuth
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'conectar-novos-canais.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PowerShell parser OK — sem login, nenhum secret, nenhum upload.'

  check-environment-before-using-secrets:
    needs: offline-safety-tests
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      contains(fromJSON('["games","kids","alchemy"]'), inputs.channel)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm the existing shared YouTube Environment allows ONLY main branch
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_SLUG: ${{ inputs.channel }}
        run: python scripts/youtube_new_channels_env_guard.py

  verify-games-oauth:
    needs: [offline-safety-tests, check-environment-before-using-secrets]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.channel == 'games' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: youtube-private-upload
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Google OAuth libraries, before using Secrets
        run: python -m pip install -r requirements-publicacao.txt
      - name: Verify Gamer channel identity ONLY (zero video uploads)
        env:
          GITHUB_ACTIONS: 'true'
          EXPECTED_CHANNEL_SLUG: games
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_GAMES_TOKEN_JSON }}
        run: python scripts/youtube_new_channels_oauth.py --action verify --channel games

  verify-kids-oauth:
    needs: [offline-safety-tests, check-environment-before-using-secrets]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.channel == 'kids' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: youtube-private-upload
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Google OAuth libraries, before using Secrets
        run: python -m pip install -r requirements-publicacao.txt
      - name: Verify Emanuelly Kids identity ONLY (zero video uploads)
        env:
          GITHUB_ACTIONS: 'true'
          EXPECTED_CHANNEL_SLUG: kids
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_KIDS_TOKEN_JSON }}
        run: python scripts/youtube_new_channels_oauth.py --action verify --channel kids

  verify-alchemy-oauth:
    needs: [offline-safety-tests, check-environment-before-using-secrets]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.channel == 'alchemy' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: youtube-private-upload
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Google OAuth libraries, before using Secrets
        run: python -m pip install -r requirements-publicacao.txt
      - name: Verify Alchemy Lab identity ONLY (zero video uploads)
        env:
          GITHUB_ACTIONS: 'true'
          EXPECTED_CHANNEL_SLUG: alchemy
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_ALCHEMY_TOKEN_JSON }}
        run: python scripts/youtube_new_channels_oauth.py --action verify --channel alchemy
