name: Fofinhos EP01 - render 15 cenas aprovadas

on:
  pull_request:
    paths:
      - "scripts/fofinhos_ep01_render.py"
      - "fofinhos-ep01.ps1"
      - "gerar-historia-kids.ps1"
      - "animar-emanuelly.ps1"
      - "motion-remotion/src/**"
      - "motion-remotion/package.json"
      - "tests/test_fofinhos_ep01_render.py"
      - ".github/workflows/fofinhos-ep01-render.yml"
  push:
    branches: [main]
    paths:
      - "scripts/fofinhos_ep01_render.py"
      - "fofinhos-ep01.ps1"
      - "gerar-historia-kids.ps1"
      - "animar-emanuelly.ps1"
      - "motion-remotion/src/**"
      - "motion-remotion/package.json"
      - "tests/test_fofinhos_ep01_render.py"
      - ".github/workflows/fofinhos-ep01-render.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install 'pytest>=8,<10' 'Pillow>=10,<13' 'numpy>=1.24,<3' 'requests>=2.31,<3'
      - name: Canonical narrations and long preview tests (zero APIs)
        run: python -m pytest -q tests/test_fofinhos_ep01_canon.py tests/test_fofinhos_ep01_render.py
      - name: Read-only canonical production plan (no assets in CI)
        run: python scripts/fofinhos_ep01_render.py --acao planejar
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: motion-remotion
        run: npm install --no-audit --no-fund
      - working-directory: motion-remotion
        run: npm run typecheck
  powershell:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Parse all changed launchers
        shell: pwsh
        run: |
          foreach ($file in @('fofinhos-ep01.ps1', 'gerar-historia-kids.ps1', 'animar-emanuelly.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "File $file failed: $($errors | Out-String)" }
          }
