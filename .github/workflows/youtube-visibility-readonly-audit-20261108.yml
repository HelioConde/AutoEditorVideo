name: AutoEditorVideo - read-only public status audit 20261108

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/youtube-visibility-audit-launch-20261108.json'

permissions:
  contents: read

concurrency:
  group: autoeditor-readonly-video-status-20261108
  cancel-in-progress: false

jobs:
  youtube-read-only-status:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'chore(youtube): audit current visibility of ten verified uploaded Shorts'
    runs-on: ubuntu-latest
    environment: youtube-private-upload
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: games
            token_secret: YOUTUBE_GAMES_TOKEN_JSON
          - channel: kids
            token_secret: YOUTUBE_KIDS_TOKEN_JSON
          - channel: alchemy
            token_secret: YOUTUBE_ALCHEMY_TOKEN_JSON
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify protected YouTube environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/youtube_env_policy_guard.py
      - name: Install Google official YouTube read-only client
        run: python -m pip install -r requirements-publicacao.txt
      - name: Read-only YouTube videos.list status and exact-owner metadata comparison
        env:
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.token_secret] }}
          AUDIT_CHANNEL: ${{ matrix.channel }}
        run: python scripts/youtube_visibility_readonly_audit_20261108.py
      - name: Preserve read-only findings; no OAuth credentials in artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-visibility-readonly-${{ matrix.channel }}-20261108
          path: reports/visibility-audit-20261108-${{ matrix.channel }}.json
          if-no-files-found: ignore
          retention-days: 7
