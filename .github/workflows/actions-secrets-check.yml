name: Credentials - verify Actions Secrets (no API calls)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-credentials-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check presence and JSON structure without calling APIs
        env:
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
          YOUTUBE_OAUTH_CLIENT_JSON: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON }}
          YOUTUBE_BR_TOKEN_JSON: ${{ secrets.YOUTUBE_BR_TOKEN_JSON }}
          YOUTUBE_EN_TOKEN_JSON: ${{ secrets.YOUTUBE_EN_TOKEN_JSON }}
          YOUTUBE_KIDS_TOKEN_JSON: ${{ secrets.YOUTUBE_KIDS_TOKEN_JSON }}
        run: python scripts/github_actions_secrets.py --check
