name: Gamer + Alchemy - V3 read-only upload reconciliation
on:
  push:
    branches: [main]
    paths:
      - 'conteudos/games-alchemy-v3-audit-20261105.json'
permissions:
  contents: read
concurrency:
  group: games-alchemy-v3-audit-one-shot-20261105
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'chore(games-alchemy): inspect existing V3 uploads before retry'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: youtube-private-upload
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: games
            secret: YOUTUBE_GAMES_TOKEN_JSON
          - channel: alchemy
            secret: YOUTUBE_ALCHEMY_TOKEN_JSON
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YouTube API dependencies
        run: python -m pip install -r requirements-publicacao.txt
      - name: Check exact YouTube identity and existing native V3 uploads WITHOUT WRITES
        env:
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.secret] }}
        run: python scripts/games_alchemy_native_v3_audit.py --channel ${{ matrix.channel }}
      - name: Save read-only channel audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-v3-audit-${{ matrix.channel }}
          path: v3-safe-reconciliation-audit/${{ matrix.channel }}.json
          retention-days: 5
          if-no-files-found: warn
