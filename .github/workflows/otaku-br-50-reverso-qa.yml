name: Otaku Multicena - 50 Shorts BR ordem reversa QA offline
on:
  push:
    branches: [main]
    paths:
      - 'conteudos/otaku-multicena-br-50-inéditos-reverso-20261106.json'
      - 'conteudos/otaku-production-reservations.json'
      - 'scripts/otaku_br_50_reverso.py'
      - 'scripts/otaku_br_50_render.py'
      - 'tests/test_otaku_br_50_reverso.py'
      - '.github/workflows/otaku-br-50-reverso-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-metadata-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner (no image or YouTube APIs)
        run: python -m pip install 'pytest>=8,<10'
      - name: Validate 50 unique Shorts, titles, tags, reservation and reverse order
        run: |
          python -m pytest -q tests/test_otaku_br_50_reverso.py
          python scripts/otaku_br_50_reverso.py --action validate
          python -m py_compile scripts/otaku_br_50_render.py
      - name: Export 50 editorial production plans only (NO uploads)
        run: python scripts/otaku_br_50_reverso.py --action plan
      - name: Upload metadata-only plans as QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: otaku-br-50-reverse-offline-editorial-plans
          path: assets/gerados/otaku-multicena-experimento-50/*/production-plan.json
          retention-days: 5
          if-no-files-found: error
