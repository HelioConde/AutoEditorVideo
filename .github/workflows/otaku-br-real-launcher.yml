name: Otaku BR - authentic AutoEditorVideo launcher offline checks

on:
  pull_request:
    paths:
      - 'testar-short-br-real.ps1'
      - 'docs/OTAKU-MULTICENA-TESTE-BR-REAL.md'
      - '.github/workflows/otaku-br-real-launcher.yml'
  push:
    branches: [main]
    paths:
      - 'testar-short-br-real.ps1'
      - 'docs/OTAKU-MULTICENA-TESTE-BR-REAL.md'
      - '.github/workflows/otaku-br-real-launcher.yml'
  workflow_dispatch:

# Never run generation/upload in CI. Only validate syntax and
# the existing repo storyboard and cache inspection with zero cost.
permissions:
  contents: read

jobs:
  parse-powershell:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse actual PowerShell launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\testar-short-br-real.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            throw "Invalid PowerShell syntax"
          }
          $source = Get-Content '.\testar-short-br-real.ps1' -Raw
          if ($source -notmatch 'criar-publicar-short\.ps1') {
            throw 'Official engine was not referenced'
          }
          if ($source -match '(?m)^\s*&\s*\$main\b[^\r\n]*\s-Publicar(\s|$)') {
            throw 'BR test runner must never publish to YouTube'
          }
          Write-Host '[PASS] Genuine engine referenced, no upload, PowerShell syntax valid.'

  plan-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact dependencies of original storyboard tools
        run: python -m pip install 'Pillow>=10,<13' 'numpy>=1.24,<3' 'requests>=2.31,<3'
      - name: Run real AutoEditorVideo storyboard and cache estimator, no generation
        run: |
          python scripts/master_scenes.py --id 5008-firefly-wedding \
            --todas-cenas --modelo gpt-image-2 --max-chamadas 0 \
            --diagnosticar-cache
          echo '[SAFETY] NO_SECRETS_NO_IA_NO_MP4_NO_YOUTUBE_UPLOAD'
