name: Gamer + Alchemy - remove internal YouTube SEO tags from six Shorts

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/games-alchemy-six-clean-internal-tags-20261105.json'

permissions:
  contents: read

concurrency:
  group: gamer-alchemy-six-clean-internal-tags-20261105
  cancel-in-progress: false

jobs:
  verify-exact-six-and-no-metadata-loss:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'fix(seo): remove uploader tracking tags from six private Shorts'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression tests and exact whitelist checks
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_youtube_public_tags_cleanup.py
          python -m py_compile scripts/cleanup_six_youtube_internal_tags.py scripts/youtube_public_tags.py

  remove-only-tracking-tags:
    needs: verify-exact-six-and-no-metadata-loss
    if: needs.verify-exact-six-and-no-metadata-loss.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: youtube-private-upload
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: games
            token_secret: YOUTUBE_GAMES_TOKEN_JSON
          - channel: alchemy
            token_secret: YOUTUBE_ALCHEMY_TOKEN_JSON
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official YouTube API library before protected credentials
        run: python -m pip install -r requirements-publicacao.txt
      - name: Keep SEO keywords and descriptions, delete technical tags only
        env:
          REMOVE_INTERNAL_TAGS_APPROVED: 'true'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.token_secret] }}
        run: python scripts/cleanup_six_youtube_internal_tags.py --channel ${{ matrix.channel }}
      - name: Retain verified removals and original keyword counts, even if a later video fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-tags-cleaned-${{ matrix.channel }}
          path: youtube-clean-tags-receipts/${{ matrix.channel }}.json
          retention-days: 7
          if-no-files-found: ignore
