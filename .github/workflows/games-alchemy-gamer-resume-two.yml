name: Gamer - resume only missing two AI Shorts

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/games-alchemy-gamer-resume-20261105.json'

permissions:
  contents: read

concurrency:
  group: gamer-2-missing-private-shorts-recovery-20261105
  cancel-in-progress: false

jobs:
  verify-original-and-prior-uploads:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'feat(gamer): resume only missing AI Shorts after checking YouTube'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check original rendering, partial upload and protected main-only Environment without Secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/games_alchemy_gamer_resume_gate.py
      - name: Compile the read-only check and selective upload routines
        run: python -m py_compile scripts/games_alchemy_gamer_resume.py scripts/games_alchemy_ai_upload.py

  resume-gamer-private:
    needs: verify-original-and-prior-uploads
    if: needs.verify-original-and-prior-uploads.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official YouTube dependencies without access to OAuth Secrets
        run: python -m pip install -r requirements-publicacao.txt
      - name: Reuse verified six MP4s; no image generation
        uses: actions/download-artifact@v4
        with:
          name: games-alchemy-six-ai-render
          run-id: 42044136670
          github-token: ${{ github.token }}
          path: cloud-games-alchemy-ai-six/
      - name: Restore receipt confirming first Gamer video was already uploaded
        uses: actions/download-artifact@v4
        with:
          name: six-ai-gamer-private-receipts
          run-id: 42048524469
          github-token: ${{ github.token }}
          path: gamer-existing-receipts/
      - name: Verify Gamer YouTube channel and upload ONLY provably missing videos
        env:
          GAMER_RESUME_APPROVED: 'true'
          AI_SIX_PILOT_ORIGINAL_RUN_ID: '42044136670'
          AI_SIX_PILOT_ORIGINAL_SHA: 'a414b9aea8d778f27c765cfb3d45e94612d0ee05'
          PREVIOUS_UPLOAD_RUN_ID: '42048524469'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_GAMES_TOKEN_JSON }}
        run: python scripts/games_alchemy_gamer_resume.py
      - name: Preserve known private YouTube video IDs even when a request is ambiguous
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamer-three-final-private-receipts
          path: cloud-games-alchemy-ai-six/games-youtube-resume-private-receipts.json
          retention-days: 7
          if-no-files-found: ignore
