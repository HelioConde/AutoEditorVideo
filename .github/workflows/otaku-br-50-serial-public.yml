name: Otaku Multicena BR - 50 Shorts SERIAIS publicos (um por vez)
on:
  push:
    branches: [main]
    paths:
      - 'conteudos/otaku-br-50-serial-launch-20261106.json'
  workflow_dispatch:
    inputs:
      number:
        description: 'Short na fila 50 ate 1'
        type: string
        required: true
        default: '50'
      authorized_public:
        description: 'O criador autorizou publicacao publica em serie, sem pular QA'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: otaku-multicena-50-shorts-serial-public
  # A creator-authorized push retry cancels a stuck previous run. Normal
  # per-episode workflow_dispatch keeps strict single-file sequencing.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  queue-and-contract:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.authorized_public == true))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      number: ${{ steps.number.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: number
        name: Pick exactly one entry in descending sequence
        shell: bash
        env:
          INPUT_NUMBER: ${{ inputs.number }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            number="$(jq -er 'if (.authorized_public == true and .channel == "br" and .channel_id == "UCXGYTuBYn-0Ziqin5ajKhOw") then .number_start else error("INVALID_SERIAL_RESUME_AUTHORIZATION") end' conteudos/otaku-br-50-serial-launch-20261106.json)"
          else
            number="$INPUT_NUMBER"
          fi
          [[ "$number" =~ ^[0-9]{1,2}$ ]]
          ((10#$number >= 1 && 10#$number <= 50))
          printf 'number=%s\n' "$((10#$number))" >> "$GITHUB_OUTPUT"
      - name: Enforce LIVE creator maintenance pause before any generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/otaku_br_50_maintenance_gate.py
      - name: Verify exactly 50 reserved originals and reverse queue
        run: |
          python scripts/otaku_br_50_reverso.py --action validate
          python -m py_compile scripts/otaku_br_50_generate_images.py \
            scripts/otaku_br_50_render.py scripts/otaku_br_50_upload_public.py
      - name: Confirm previous Short had a public processed video AND cover before spending images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ steps.number.outputs.number }}
        run: |
          set -euo pipefail
          current=$((6100 + NUM))
          path="repos/$GITHUB_REPOSITORY/contents/dados/otaku-br-50-reverso-recibos/$current-multicena-experimento-novembro.json"
          if gh api "$path" --jq '.sha' >/dev/null 2>&1; then
            echo "FAIL: receipt exists, never repeat upload or charge new images"
            exit 1
          fi
          if ((NUM < 50)); then
            previous=$((current + 1))
            prior="repos/$GITHUB_REPOSITORY/contents/dados/otaku-br-50-reverso-recibos/$previous-multicena-experimento-novembro.json"
            gh api "$prior" --jq '.content' | base64 --decode |
              jq -e '.stage == "public_processed_cover_acknowledged" and .public_verified == true and .thumbnail_api_acknowledged == true'
          fi
          echo "[SERIAL] ONE_AT_A_TIME_PREVIOUS_COVER_CONFIRMED"

  check-image-environment:
    needs: queue-and-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm image-generation Environment restricted to main only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/image_env_policy_guard.py

  check-youtube-environment:
    needs: queue-and-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm YouTube Environment restricted to main only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/youtube_env_policy_guard.py

  generate-render-one:
    needs: [queue-and-contract, check-image-environment, check-youtube-environment]
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    environment: image-generation
    permissions:
      contents: read
      actions: read
    env:
      EPISODE_NUMBER: ${{ needs.queue-and-contract.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pre-rendered Short from five-way parallel test
        id: prepared-cache
        uses: actions/cache/restore@v4
        with:
          path: assets/gerados/otaku-multicena-experimento-50/
          key: otaku-br-50-prepared-v1-${{ env.EPISODE_NUMBER }}-${{ hashFiles('scripts/otaku_br_50_generate_images.py', 'scripts/otaku_br_50_render.py', 'conteudos/otaku-multicena-br-50-inéditos-reverso-20261106.json', 'motion-remotion/src/**', 'motion-remotion/package-lock.json') }}
          restore-keys: |
            otaku-br-50-prepared-v1-${{ env.EPISODE_NUMBER }}-
      - name: Fetch immutable upstream image-provider proxy BEFORE secrets
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.prepared-cache.outputs.cache-matched-key == ''
        uses: actions/checkout@v4
        with:
          repository: 10/chatgpt-codex-proxy
          ref: 1da5476e46ef62830d7016de2a931b0b8270a6c4
          path: pinned-native-go-proxy
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.prepared-cache.outputs.cache-matched-key == ''
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-master.txt
      - uses: actions/setup-node@v4
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.prepared-cache.outputs.cache-matched-key == ''
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion-remotion/package-lock.json
      - uses: actions/setup-go@v6
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.prepared-cache.outputs.cache-matched-key == ''
        with:
          go-version-file: pinned-native-go-proxy/go.mod
          cache: false
      - name: Restore persistent FFmpeg+FFprobe binaries between Shorts
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.prepared-cache.outputs.cache-matched-key == ''
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: .cache/otaku-br-50/ffmpeg
          key: otaku-br-50-ffmpeg8-static-3.0-ubuntu24-x64-v1
      - name: Install Python dependencies and prepare cached FFmpeg without apt
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.prepared-cache.outputs.cache-matched-key == ''
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-master.txt 'static-ffmpeg==3.0'
          python scripts/otaku_br_50_setup_media.py --dir .cache/otaku-br-50/ffmpeg
          export PATH="$GITHUB_WORKSPACE/.cache/otaku-br-50/ffmpeg:$PATH"
          echo "$GITHUB_WORKSPACE/.cache/otaku-br-50/ffmpeg" >> "$GITHUB_PATH"
          command -v ffmpeg
          command -v ffprobe
          python -c 'import sys; sys.path.insert(0,"scripts"); from capa_cinematografica import load_font; assert load_font(22).getbbox("TESTE") is not None; print("[MEDIA] Gerador de fontes aprovado")'
      - name: Restore Remotion installed dependencies from the prior Shorts
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.prepared-cache.outputs.cache-matched-key == ''
        id: remotion-cache
        uses: actions/cache@v4
        with:
          path: motion-remotion/node_modules
          key: otaku-br-50-remotion-ubuntu24-node22-${{ hashFiles('motion-remotion/package-lock.json') }}
      - name: Install Remotion only when lockfile cache changes
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.prepared-cache.outputs.cache-matched-key == '' && steps.remotion-cache.outputs.cache-hit != 'true'
        working-directory: motion-remotion
        run: npm ci --no-audit --no-fund
      - name: Validate cached Remotion and TypeScript (no repeated npm ci)
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.prepared-cache.outputs.cache-matched-key == ''
        working-directory: motion-remotion
        run: npm run typecheck
      - name: Restore previously compiled pinned image provider
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.prepared-cache.outputs.cache-matched-key == ''
        id: proxy-cache
        uses: actions/cache@v4
        with:
          path: .cache/otaku-br-50/proxy/otaku-native-proxy
          key: otaku-br-50-proxy-go1269-1da5476e-ubuntu24-v1-${{ hashFiles('pinned-native-go-proxy/go.sum') }}
      - name: Compile pinned Go image provider ONCE per cache version
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.prepared-cache.outputs.cache-matched-key == '' && steps.proxy-cache.outputs.cache-hit != 'true'
        working-directory: pinned-native-go-proxy
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/otaku-br-50/proxy"
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/.cache/otaku-br-50/proxy/otaku-native-proxy" ./cmd/api
      - name: Verify cached provider is executable
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.prepared-cache.outputs.cache-matched-key == ''
        run: test -x .cache/otaku-br-50/proxy/otaku-native-proxy
      - name: Generate one video's FIVE images; then narrate, align, render and make the official cover
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.prepared-cache.outputs.cache-matched-key == ''
        shell: bash
        env:
          IMAGE_MODEL: gpt-image-2
          MAX_IMAGE_CALLS: '5'
          PROXY_ACCOUNTS_JSON: ${{ secrets.PROXY_ACCOUNTS_JSON }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          state_dir="$RUNNER_TEMP/otaku-50-image-private"
          mkdir -m 700 "$state_dir"
          proxy_pid=''
          cleanup() {
            if [[ -n "$proxy_pid" ]]; then kill "$proxy_pid" 2>/dev/null || true; fi
            rm -rf -- "$state_dir"
            rm -f "$RUNNER_TEMP/otaku-br-50-proxy.log"
          }
          trap cleanup EXIT
          # Recheck immediately before accessing provider accounts.
          python scripts/otaku_br_50_maintenance_gate.py
          python scripts/proxy_accounts_private_stage.py "$state_dir"
          unset PROXY_ACCOUNTS_JSON
          DATA_DIR="$state_dir" DEBUG_LOG_PAYLOADS=false GIN_MODE=release PORT=8080 \
            "$GITHUB_WORKSPACE/.cache/otaku-br-50/proxy/otaku-native-proxy" >"$RUNNER_TEMP/otaku-br-50-proxy.log" 2>&1 &
          proxy_pid=$!
          python scripts/otaku_br_50_generate_images.py --number "$EPISODE_NUMBER"
          python scripts/otaku_br_50_render.py --action render --number "$EPISODE_NUMBER"
          echo "[ONE VIDEO] RENDERED_AND_COVER_CREATED_NO_YOUTUBE_OAUTH_PRESENT"
      - name: Verify complete media whether restored or freshly rendered
        run: python scripts/otaku_br_50_validate_prepared.py --number "$EPISODE_NUMBER"
      - name: Retain this single video, original cover, word timings and QA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: otaku-br-50-one-${{ env.EPISODE_NUMBER }}
          path: assets/gerados/otaku-multicena-experimento-50/
          retention-days: 10
          if-no-files-found: error

  upload-public-cover-one:
    needs: [queue-and-contract, generate-render-one, check-youtube-environment]
    if: >-
      needs.generate-render-one.result == 'success' &&
      needs.check-youtube-environment.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: youtube-private-upload
    permissions:
      contents: write
      actions: read
    env:
      EPISODE_NUMBER: ${{ needs.queue-and-contract.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official upload and cover dependencies (no secrets in logs)
        run: python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Download ONLY this video's audited media, no other videos
        uses: actions/download-artifact@v4
        with:
          name: otaku-br-50-one-${{ env.EPISODE_NUMBER }}
          path: assets/gerados/otaku-multicena-experimento-50/
      - name: Verify BR OAuth ID, publish PUBLIC, wait for processing, attach generated cover, record receipt
        env:
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_BR_TOKEN_JSON: ${{ secrets.YOUTUBE_BR_TOKEN_JSON }}
          PUBLIC_50_BR_AUTHORIZED: 'true'
          GH_TOKEN: ${{ github.token }}
        run: python scripts/otaku_br_50_upload_public.py --number "$EPISODE_NUMBER"
      - name: Preserve receipt on failure to prevent duplicate uploads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otaku-br-50-upload-result-${{ env.EPISODE_NUMBER }}
          path: assets/gerados/otaku-multicena-experimento-50/*/public-upload-result.json
          if-no-files-found: ignore
          retention-days: 30

  launch-next-only-after-covered-publication:
    needs: [queue-and-contract, upload-public-cover-one]
    if: needs.upload-public-cover-one.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch only next lower number (NO simultaneous generation)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ needs.queue-and-contract.outputs.number }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          if ((NUM == 1)); then
            echo "[COMPLETED] Last number 01 covered and public. Nothing else to dispatch."
            exit 0
          fi
          next=$((NUM-1))
          sleep 180
          # Recheck live main AFTER the delay; no stale run may restart
          # after the creator has requested maintenance.
          python scripts/otaku_br_50_maintenance_gate.py
          gh workflow run otaku-br-50-serial-public.yml \
            -R "$GITHUB_REPOSITORY" --ref main \
            -f number="$next" -f authorized_public=true
          echo "[SERIAL] NEXT_ONLY_NUMBER=$next"
