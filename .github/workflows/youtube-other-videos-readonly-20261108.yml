name: AutoEditorVideo - read-only audit of other videos across 5 channels
on:
  push:
    branches: [main]
    paths:
      - 'conteudos/youtube-other-videos-readonly-check-20261108.json'
permissions:
  contents: read
concurrency:
  group: youtube-other-video-audit-20261108
  cancel-in-progress: false
jobs:
  verify-and-read:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'diagnose(youtube): inspect actual owned status for all 16 video IDs'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
      actions: read
    environment: youtube-private-upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: en
            secret: YOUTUBE_EN_TOKEN_JSON
          - channel: games
            secret: YOUTUBE_GAMES_TOKEN_JSON
          - channel: alchemy
            secret: YOUTUBE_ALCHEMY_TOKEN_JSON
          - channel: br
            secret: YOUTUBE_BR_TOKEN_JSON
          - channel: kids
            secret: YOUTUBE_KIDS_TOKEN_JSON
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure immutable read-only source without YouTube mutation methods
        run: |
          python -m py_compile scripts/youtube_other_videos_readonly_20261108.py
          python - <<'PY'
          from pathlib import Path
          s=Path("scripts/youtube_other_videos_readonly_20261108.py").read_text()
          assert not any(x in s for x in (".videos().insert(", ".videos().update(", ".videos().delete(", ".thumbnails().set(", "request_image("))
          print("READ_ONLY_NO_MUTATIONS_APPROVED")
          PY
      - name: Install Google YouTube Data API only
        run: python -m pip install -r requirements-publicacao.txt
      - name: Check current YouTube API status for exact named channel and video IDs
        env:
          CHANNEL_READONLY_AUDIT_AUTHORIZED: 'yes'
          AUDIT_CHANNEL: ${{ matrix.channel }}
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.secret] }}
        run: python scripts/youtube_other_videos_readonly_20261108.py --channel ${{ matrix.channel }}
      - name: Persist private sanitized read-only status summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-other-video-current-state-${{ matrix.channel }}-20261108
          path: youtube-other-video-audit-results/${{ matrix.channel }}.json
          retention-days: 7
          if-no-files-found: ignore
