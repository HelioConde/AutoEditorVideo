name: Emanuelly Kids - reconcile and recover 3 rendered private Shorts

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/kids-static-90s-recovery-20261107.json'

permissions:
  contents: read

concurrency:
  group: kids-20261107-original-stills-private-recovery-single-flight
  cancel-in-progress: false

jobs:
  offline-preflight:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'fix(kids): recover three rendered 90s Shorts from run 42393346725'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 308 fix, deduplication and original Kids plan (offline)
        run: |
          python -m pip install 'Pillow>=10,<13' 'pytest>=8,<10'
          python -m py_compile scripts/kids_static_90s_upload_20261107.py
          python -m pytest -q tests/test_kids_static_90s_20261107.py tests/test_kids_upload_recovery_20261107.py
          python scripts/kids_static_90s_upload_20261107.py --action preflight
      - name: Verify single-use launch is locked to prior three rendered videos, NO new image calls
        run: |
          python - <<'PY'
          import json
          d=json.load(open('conteudos/kids-static-90s-recovery-20261107.json',encoding='utf-8'))
          assert d == {
            'schema':'autoeditorvideo/kids-original-static-private-recovery/v1',
            'user_authorized_at':'2026-11-07',
            'recovered_from_failed_run':42393346725,
            'source_artifact_id':13583072874,
            'source_artifact_name':'emanuelly-kids-static-three-mp4-20261107',
            'source_artifact_sha256':'2297ca1cfd51567a460d4007eb628dd34bf900b5f5ae83dc275d24a3ffead77f',
            'channel':'kids',
            'channel_id':'UCxEzVW2Uy44OUVurTQSg_Eg',
            'episode_ids':['kids-101-elefantinho-agua-escondida','kids-102-quiz-sombras-animais','kids-103-dinos-segredos-incriveis'],
            'image_generation':False,
            'youtube_upload_initial_privacy':'private',
            'made_for_kids':True,
            'fofinhos_series_excluded':True,
            'require_readonly_reconcile_before_insert':True,
            'no_blind_retry':True
          }
          print('KIDS_RECOVERY_REUSE_ARTIFACT_NO_NEW_GENERATION_CHECKED')
          PY

  protected-youtube-environment-preflight:
    needs: offline-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify shared YouTube Environment custom main-only policy without OAuth
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os
          from youtube_new_channels_env_guard import fetch_protected_policy, policy_is_main_only
          env,policies=fetch_protected_policy('kids',os.environ.get('GH_TOKEN',''))
          policy_is_main_only('kids',env,policies)
          print('KIDS_YOUTUBE_RECOVERY_PROTECTED_ENV_VERIFIED_NO_OAUTH_USED')
          PY

  recover-three-kids-private:
    needs: [offline-preflight, protected-youtube-environment-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google API, metadata verification and ffprobe with NO image model
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Reuse all 3 real MP4 and official thumbnails from original successful render (run 42393346725)
        uses: actions/download-artifact@v4
        with:
          name: emanuelly-kids-static-three-mp4-20261107
          run-id: 42393346725
          github-token: ${{ github.token }}
          path: cloud-kids-static-20261107/
      - name: Read own private uploads, reconcile prior ambiguous HTTP 308, and upload only missing videos
        env:
          KIDS_UPLOAD_AUTHORIZED: 'yes'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_KIDS_TOKEN_JSON }}
        run: python scripts/kids_static_90s_upload_20261107.py --action upload
      - name: Preserve every matched or uploaded video ID even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-three-private-upload-recovery-receipts-20261107
          path: cloud-kids-static-20261107/kids-private-youtube-receipts.json
          retention-days: 7
          if-no-files-found: ignore
