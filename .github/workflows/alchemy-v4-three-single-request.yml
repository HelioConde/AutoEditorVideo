name: Alchemy - retry three Shorts with single-request upload
on:
  push:
    branches: [main]
    paths:
      - 'conteudos/alchemy-v4-three-single-request-20261105.json'
permissions:
  contents: read
concurrency:
  group: alchemy-v4-exact-three-single-request-20261105
  cancel-in-progress: false
jobs:
  verify-three-alchemy-only:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'feat(alchemy): resend exactly three V4 Shorts privately via single-request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline one-shot approval and channel-isolation QA
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_alchemy_v4_single_request_retry.py
          python -m py_compile scripts/alchemy_v4_single_request_retry.py
  send-three-alchemy-private:
    needs: verify-three-alchemy-only
    if: needs.verify-three-alchemy-only.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google YouTube API without channel secrets
        run: python -m pip install -r requirements-publicacao.txt
      - name: Download existing V4 AI videos and program-made thumbnails, no new render
        uses: actions/download-artifact@v4
        with:
          name: gamer-alchemy-reference-v4-six
          run-id: 42074829801
          github-token: ${{ github.token }}
          path: alchemy-source-v4/
      - name: Non-resumable upload 3 Alchemy V4 videos as PRIVATE, confirm processing and send original-program thumbnails
        env:
          ALCHEMY_V4_RETRY_APPROVED: 'true'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_ALCHEMY_TOKEN_JSON }}
        run: python scripts/alchemy_v4_single_request_retry.py
      - name: Save each accepted YouTube video ID before thumbnail step, including partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-three-v4-single-request-receipts
          path: alchemy-v4-retry-receipts.json
          if-no-files-found: ignore
          retention-days: 7
