name: English channel smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'scripts/renderizar_shorts_en.py'
      - 'scripts/english_caption_design.py'
      - 'scripts/otaku_reframe_direction.py'
      - 'conteudos/otaku-reframe-ep01-en.json'
      - 'conteudos/otaku-reframe-did-you-know-201-en.json'
      - 'tests/test_otaku_reframe_fact_201_en.py'
      - 'scripts/otaku_reframe_production.py'
      - 'scripts/validar_reframe_en.py'
      - 'scripts/qa_automatico_reframe_en.py'
      - 'tests/test_qa_automatico_reframe_en.py'
      - 'tests/test_uploader_retention_en.py'
      - 'scripts/revisar_reframe_en.py'
      - 'tests/test_revisar_reframe_en.py'
      - 'tests/test_otaku_reframe_production.py'
      - 'tests/test_validar_reframe_en.py'
      - 'AGENTS.md'
      - 'tests/test_otaku_reframe_direction.py'
      - 'tests/test_english_caption_design.py'
      - 'gerar-otaku-reframe.ps1'
      - 'scripts/publicar_shorts_en.py'
      - 'scripts/renderizar_master_remotion.py'
      - 'conteudos/testes-animados-5-en.json'
      - 'tests/test_shorts_en.py'
      - 'tests/test_preparar_publicados_en_v3.py'
      - 'scripts/preparar_publicados_en_v3.py'
      - 'preparar-publicados-en.ps1'
      - 'conteudos/otaku-br-publicados-snapshot-20261104.json'
      - 'conteudos/otaku-br-publicados-en-curadoria-v3.json'
      - 'gerar-shorts-en.ps1'
      - 'publicar-shorts-en.ps1'
      - '.github/workflows/english-channel.yml'
  pull_request:
    paths:
      - 'scripts/renderizar_shorts_en.py'
      - 'scripts/english_caption_design.py'
      - 'scripts/otaku_reframe_direction.py'
      - 'conteudos/otaku-reframe-ep01-en.json'
      - 'conteudos/otaku-reframe-did-you-know-201-en.json'
      - 'tests/test_otaku_reframe_fact_201_en.py'
      - 'scripts/otaku_reframe_production.py'
      - 'scripts/validar_reframe_en.py'
      - 'scripts/qa_automatico_reframe_en.py'
      - 'tests/test_qa_automatico_reframe_en.py'
      - 'tests/test_uploader_retention_en.py'
      - 'scripts/revisar_reframe_en.py'
      - 'tests/test_revisar_reframe_en.py'
      - 'tests/test_otaku_reframe_production.py'
      - 'tests/test_validar_reframe_en.py'
      - 'AGENTS.md'
      - 'tests/test_otaku_reframe_direction.py'
      - 'tests/test_english_caption_design.py'
      - 'gerar-otaku-reframe.ps1'
      - 'scripts/publicar_shorts_en.py'
      - 'scripts/renderizar_master_remotion.py'
      - 'conteudos/testes-animados-5-en.json'
      - 'tests/test_shorts_en.py'
      - 'tests/test_preparar_publicados_en_v3.py'
      - 'scripts/preparar_publicados_en_v3.py'
      - 'preparar-publicados-en.ps1'
      - 'conteudos/otaku-br-publicados-snapshot-20261104.json'
      - 'conteudos/otaku-br-publicados-en-curadoria-v3.json'
      - 'gerar-shorts-en.ps1'
      - 'publicar-shorts-en.ps1'
      - '.github/workflows/english-channel.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10' 'Pillow>=10,<13' 'numpy>=1.24,<3' 'requests>=2.31,<3'
      - name: English manifest, safe OAuth, isolated render and publisher
        run: python -m pytest -q tests/test_shorts_en.py tests/test_otaku_reframe_direction.py tests/test_otaku_reframe_fact_201_en.py tests/test_english_caption_design.py tests/test_otaku_reframe_production.py tests/test_validar_reframe_en.py tests/test_revisar_reframe_en.py tests/test_qa_automatico_reframe_en.py tests/test_uploader_retention_en.py tests/test_preparar_publicados_en_v3.py
