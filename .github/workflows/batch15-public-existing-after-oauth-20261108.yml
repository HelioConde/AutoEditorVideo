name: AutoEditorVideo - publish nine existing Shorts after new OAuth

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite exatamente PUBLICAR-9-SEM-DUPLICAR para alterar apenas os 9 IDs existentes'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: batch15-existing-shorts-public-only-once
  cancel-in-progress: false

jobs:
  creator-approval:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      inputs.confirmar == 'PUBLICAR-9-SEM-DUPLICAR'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline safety tests: 9 known private IDs, no new insert, audience flag correct
        run: |
          python -m py_compile scripts/batch15_publicize_reviewed_20261108.py scripts/youtube_public_edit_oauth_local.py
          python - <<'PY'
          import json
          from pathlib import Path
          import ast
          p=Path('scripts/batch15_publicize_reviewed_20261108.py')
          code=p.read_text(encoding='utf-8')
          tree=ast.parse(code)
          approval=json.loads(Path('conteudos/lote-15-public-approval-20261108.json').read_text(encoding='utf-8'))
          assert approval['source_run_id']==42481839933
          assert approval['source_sha']=='49bdeaf75201ce2bc363836b4ac9ee4dbc19f0b6'
          assert approval['creator_publication_authorized'] is True
          assert approval['reviewed_channels']==['games','kids','alchemy']
          assert approval['no_blind_reupload'] is True
          assert 'videos().insert(' not in code and 'videos().delete(' not in code
          assert 'videos().update(' in code
          print('ONLY_EXISTING_APPROVED_SHORTS_PUBLICATION_AUTHORIZED')
          PY
      - name: Require main-only restricted Google OAuth Environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/youtube_env_policy_guard.py

  publish-existing-privates:
    needs: creator-approval
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: youtube-private-upload
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - channel: games
            token_secret: YOUTUBE_GAMES_TOKEN_JSON
          - channel: kids
            token_secret: YOUTUBE_KIDS_TOKEN_JSON
          - channel: alchemy
            token_secret: YOUTUBE_ALCHEMY_TOKEN_JSON
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified Google YouTube API read/update client
        run: python -m pip install -r requirements-publicacao.txt
      - name: Obtain only original 3 exact video IDs from the source GitHub run
        uses: actions/download-artifact@v4
        with:
          name: batch15-${{ matrix.channel }}-private-youtube-receipts-20261108
          run-id: 42481839933
          github-token: ${{ github.token }}
          path: cloud-lote-15-canais-20261108/${{ matrix.channel }}/
      - name: Change existing verified private IDs to public (never insert/reupload)
        env:
          BATCH15_PUBLIC_CHANNEL: ${{ matrix.channel }}
          BATCH15_PUBLIC_AUTHORIZED: 'yes'
          BATCH15_MANUAL_PUBLIC_CONFIRM: PUBLICAR-9-SEM-DUPLICAR
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.token_secret] }}
        run: python scripts/batch15_publicize_reviewed_20261108.py --channel ${{ matrix.channel }} --action publish
      - name: Save exact YouTube IDs, public verification and blocked statuses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch15-public-recheck-${{ matrix.channel }}-${{ github.run_id }}
          path: cloud-lote-15-canais-20261108/${{ matrix.channel }}/public-transition-receipts.json
          if-no-files-found: ignore
          retention-days: 7
