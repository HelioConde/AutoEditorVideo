name: AutoEditorVideo - trending Straw Hats BR and JoJo Part 7 OP EN private

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/trending-single-br-en-launch-20261109.json'

permissions:
  contents: read

concurrency:
  group: trending-strawhats-br-jojo-op-en-20261109-once
  cancel-in-progress: false

jobs:
  editorial-preflight:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'feat(trends): launch single Straw Hats BR and JoJo OP EN private uploads'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 2 unique SEO trends, 8 canonical scenes, 60s policy, and private-only launch
        run: |
          set -euo pipefail
          python -m pip install 'Pillow>=10,<13'
          python -m py_compile scripts/otaku_trending_single_br_en_20261109.py
          python scripts/otaku_trending_single_br_en_20261109.py --channel br --action validate
          python scripts/otaku_trending_single_br_en_20261109.py --channel en --action validate
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('conteudos/trending-single-br-en-20261109.json').read_text(encoding='utf8'))
          assert manifest['target_total']==2 and [r['channel'] for r in manifest['episodes']]==['br','en']
          assert manifest['privacy']=='private_first'
          assert manifest['episodes'][0]['tags'][0]=='chapeus de palha'
          assert manifest['episodes'][1]['tags'][0]=='jojo part 7 op'
          assert all(r['character_identity_bible'] and len(r['scenes'])==8 for r in manifest['episodes'])
          from shorts_duration import MAX_SECONDS
          assert MAX_SECONDS==60
          print('BR_EN_TRENDS_UNIQUE_PRIVATE_CANONICAL_60S_PREFLIGHT_PASSED')
          PY

  verify-image-environment:
    needs: editorial-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require protected image Environment main-only before loading secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/image_env_policy_guard.py

  verify-youtube-environment:
    needs: editorial-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require protected YouTube Environment main-only before loading OAuth
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/youtube_env_policy_guard.py

  render:
    needs: [editorial-preflight, verify-image-environment]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        channel: [br, en]
    runs-on: ubuntu-24.04
    timeout-minutes: 245
    environment: image-generation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned original native image provider proxy
        uses: actions/checkout@v4
        with:
          repository: 10/chatgpt-codex-proxy
          ref: 1da5476e46ef62830d7016de2a931b0b8270a6c4
          path: pinned-native-go-proxy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion-remotion/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: pinned-native-go-proxy/go.mod
          cache: false
      - name: Install original production media toolchain, caption and thumbnail engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-master.txt 'edge-tts>=7,<9' 'Pillow>=10,<13'
      - name: Prepare canonical original Remotion MasterShort renderer
        working-directory: motion-remotion
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Compile pinned Go proxy BEFORE image secrets
        working-directory: pinned-native-go-proxy
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/batch15-native-proxy" ./cmd/api
      - name: Produce one canonical character-anchored 60s Short per channel, original edits only
        shell: bash
        env:
          PROXY_ACCOUNTS_JSON: ${{ secrets.PROXY_ACCOUNTS_JSON }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
          IMAGE_MODEL: gpt-image-2
          TREND_CHANNEL: ${{ matrix.channel }}
          TREND_IMAGE_RENDER_AUTHORIZED: 'yes'
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/batch15-${TREND_CHANNEL}-private-proxy"
          mkdir -m 700 "$private_dir"
          proxy_pid=''
          cleanup() {
            if [[ -n "$proxy_pid" ]]; then kill "$proxy_pid" 2>/dev/null || true; fi
            rm -rf -- "$private_dir"
            rm -f -- "$RUNNER_TEMP/batch15-${TREND_CHANNEL}-proxy.log"
          }
          trap cleanup EXIT
          python scripts/proxy_accounts_private_stage.py "$private_dir"
          unset PROXY_ACCOUNTS_JSON
          DATA_DIR="$private_dir" DEBUG_LOG_PAYLOADS=false GIN_MODE=release PORT=8080 \
            "$RUNNER_TEMP/batch15-native-proxy" >"$RUNNER_TEMP/batch15-${TREND_CHANNEL}-proxy.log" 2>&1 &
          proxy_pid=$!
          python scripts/otaku_trending_single_br_en_20261109.py --channel "$TREND_CHANNEL" --action render
          echo "TREND_ONE_ORIGINAL_SHORT_PRIVATE_READY_${TREND_CHANNEL}"
      - name: Preserve 3 MP4s, official covers, QA, storyboard artwork and no secrets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trending-br-en-media-${{ matrix.channel }}-20261108
          path: |
            cloud-trending-br-en-20261109/${{ matrix.channel }}/**/summary.json
            cloud-trending-br-en-20261109/${{ matrix.channel }}/**/final.mp4
            cloud-trending-br-en-20261109/${{ matrix.channel }}/**/thumb.jpg
            cloud-trending-br-en-20261109/${{ matrix.channel }}/**/qa.json
            cloud-trending-br-en-20261109/${{ matrix.channel }}/**/metadata.json
            cloud-trending-br-en-20261109/${{ matrix.channel }}/**/character-identity-provenance.json
            cloud-trending-br-en-20261109/${{ matrix.channel }}/**/anchor-*.png
            cloud-trending-br-en-20261109/${{ matrix.channel }}/**/scene-*.png
          retention-days: 7
          if-no-files-found: error

  upload-private:
    needs: [editorial-preflight, verify-youtube-environment, render]
    if: >-
      always() &&
      needs.editorial-preflight.result == 'success' &&
      needs.verify-youtube-environment.result == 'success' &&
      needs.render.result != 'cancelled'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - channel: br
            token_secret: YOUTUBE_BR_TOKEN_JSON
          - channel: en
            token_secret: YOUTUBE_EN_TOKEN_JSON
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: youtube-private-upload
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official YouTube API/ffprobe libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Obtain only the matching three media files created in THIS SAME run
        uses: actions/download-artifact@v4
        with:
          name: trending-br-en-media-${{ matrix.channel }}-20261108
          path: cloud-trending-br-en-20261109/${{ matrix.channel }}/
      - name: Verify exact channel identity, SHA256 and privacy then upload only missing new videos
        env:
          TREND_CHANNEL: ${{ matrix.channel }}
          TREND_PRIVATE_UPLOAD_AUTHORIZED: 'yes'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.token_secret] }}
        run: python scripts/otaku_trending_single_br_en_20261109.py --channel ${{ matrix.channel }} --action upload
      - name: Preserve every actual YouTube ID even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trending-br-en-private-youtube-receipts-${{ matrix.channel }}-20261108
          path: cloud-trending-br-en-20261109/${{ matrix.channel }}/**/youtube-private-receipt.json
          retention-days: 7
          if-no-files-found: ignore
