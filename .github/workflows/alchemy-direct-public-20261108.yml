name: AutoEditorVideo - Alchemy original direct-public trial

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/alchemy-publico-direto-launch-20261108.json'

permissions:
  contents: read

concurrency:
  group: autoeditor-alchemy-single-public-20261108
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'feat(alchemy): launch AutoEditorVideo new direct-public Short'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate one original public video, no duplicate ID, no cross-channel token
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m py_compile scripts/alchemy_public_direct_20261108.py scripts/alchemy_public_direct_upload_20261108.py
          python scripts/alchemy_public_direct_20261108.py --action validate
          python scripts/alchemy_public_direct_upload_20261108.py --action validate
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("conteudos/alchemy-publico-direto-launch-20261108.json").read_text(encoding="utf-8"))
          assert x["schema"]=="autoeditorvideo/alchemy-direct-public-launch/v1"
          assert x["creator_approved_public"] is True
          assert x["target_channel"]=="alchemy"
          assert x["episode_id"]=="alchemy-107-automacao-publicou-duplicado"
          assert x["new_upload_visibility"]=="public"
          assert x["new_upload_not_reupload"] is True
          assert x["never_touch_existing_private_videos"] is True
          assert x["max_image_calls"]==8
          script=Path("scripts/alchemy_public_direct_upload_20261108.py").read_text(encoding="utf-8")
          assert 'api.videos().insert(' in script
          assert '"privacyStatus":"public"' in script
          assert "videos().update(" not in script and "videos().delete(" not in script
          print("AUTOEDITOR_PUBLIC_CREATOR_APPROVAL_AND_UPLOAD_POLICY_PASSED")
          PY

  image-policy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate main-only image-generation Environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/image_env_policy_guard.py

  youtube-policy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate main-only protected YouTube Environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/youtube_env_policy_guard.py

  render:
    needs: [preflight, image-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    environment: image-generation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned original Codex image provider proxy
        uses: actions/checkout@v4
        with:
          repository: 10/chatgpt-codex-proxy
          ref: 1da5476e46ef62830d7016de2a931b0b8270a6c4
          path: pinned-native-go-proxy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion-remotion/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: pinned-native-go-proxy/go.mod
          cache: false
      - name: Install AutoEditorVideo image, speech, caption and video dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-master.txt 'edge-tts>=7,<9' 'Pillow>=10,<13'
      - name: Install original Remotion video composer
        working-directory: motion-remotion
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Build trusted image proxy before reading protected secrets
        working-directory: pinned-native-go-proxy
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/alchemy-public-proxy" ./cmd/api
      - name: Generate one new original 90-120s video, eight image calls maximum
        shell: bash
        env:
          PROXY_ACCOUNTS_JSON: ${{ secrets.PROXY_ACCOUNTS_JSON }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
          IMAGE_MODEL: gpt-image-2
          MAX_IMAGE_CALLS: '8'
          PUBLIC_PILOT_RENDER_AUTHORIZED: 'yes'
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/alchemy-public-proxy-state"
          mkdir -m 700 "$private_dir"
          proxy_pid=''
          cleanup() {
            if [[ -n "$proxy_pid" ]]; then kill "$proxy_pid" 2>/dev/null || true; fi
            rm -rf -- "$private_dir"
            rm -f -- "$RUNNER_TEMP/alchemy-public-proxy.log"
          }
          trap cleanup EXIT
          python scripts/proxy_accounts_private_stage.py "$private_dir"
          unset PROXY_ACCOUNTS_JSON
          DATA_DIR="$private_dir" DEBUG_LOG_PAYLOADS=false GIN_MODE=release PORT=8080 \
            "$RUNNER_TEMP/alchemy-public-proxy" >"$RUNNER_TEMP/alchemy-public-proxy.log" 2>&1 &
          proxy_pid=$!
          python scripts/alchemy_public_direct_20261108.py --action render
          echo "AUTOEDITOR_ALCHEMY_SINGLE_ORIGINAL_VIDEO_RENDER_QA_PASSED"
      - name: Preserve video, thumbnail, QA, metadata and illustrations
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: autoeditor-alchemy-public-original-20261108
          path: |
            cloud-alchemy-publico-direto-20261108/alchemy/summary.json
            cloud-alchemy-publico-direto-20261108/alchemy/**/final.mp4
            cloud-alchemy-publico-direto-20261108/alchemy/**/thumb.jpg
            cloud-alchemy-publico-direto-20261108/alchemy/**/qa.json
            cloud-alchemy-publico-direto-20261108/alchemy/**/metadata.json
            cloud-alchemy-publico-direto-20261108/alchemy/**/scene-*.png
          if-no-files-found: error
          retention-days: 7

  upload-public:
    needs: [preflight, youtube-policy, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: youtube-private-upload
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YouTube API client and QA tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Download only the new video from this same run
        uses: actions/download-artifact@v4
        with:
          name: autoeditor-alchemy-public-original-20261108
          path: cloud-alchemy-publico-direto-20261108/alchemy/
      - name: Upload new Short DIRECTLY AS PUBLIC, verify exact channel and readback
        env:
          PUBLIC_PILOT_UPLOAD_AUTHORIZED: 'yes'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_ALCHEMY_TOKEN_JSON }}
        run: python scripts/alchemy_public_direct_upload_20261108.py --action upload
      - name: Save real YouTube ID and actual observed PUBLIC status even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoeditor-alchemy-public-upload-receipt-20261108
          path: cloud-alchemy-publico-direto-20261108/alchemy/youtube-public-upload-receipt.json
          if-no-files-found: ignore
          retention-days: 7
