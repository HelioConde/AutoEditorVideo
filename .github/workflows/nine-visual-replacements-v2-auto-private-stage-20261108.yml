name: AutoEditorVideo - auto stage nine corrected MP4 replacements privately

on:
  workflow_run:
    workflows:
      - AutoEditorVideo - nine image-corrected replacements EN Gamer Alchemy
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-replacements-v2-private-stage-exact-render-run-42449154499
  cancel-in-progress: false

jobs:
  verify-source-and-main-protection:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.id == 42449154499 &&
      github.event.workflow_run.head_sha == '0841f7523e5a50bb48ab4f6399cd95350a82a36a' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact nine versions, original canonical character anchors and privacy policy
        run: |
          python -m pip install 'Pillow>=10,<13' 'pytest>=8,<10'
          python -m py_compile scripts/nine_visual_replacements_v2_upload_20261108.py
          python -m pytest -q tests/test_nine_visual_replacements_v2_20261108.py
          for c in en games alchemy; do
            python scripts/nine_visual_replacements_v2_upload_20261108.py --channel "$c" --action preflight
          done
      - name: Check protected main-only YouTube OAuth environment (no channel secret read)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/youtube_env_policy_guard.py

  stage-three-per-channel-private:
    needs: verify-source-and-main-protection
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - channel: en
            secret: YOUTUBE_EN_TOKEN_JSON
          - channel: games
            secret: YOUTUBE_GAMES_TOKEN_JSON
          - channel: alchemy
            secret: YOUTUBE_ALCHEMY_TOKEN_JSON
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original official Google YouTube SDK, ffprobe and integrity tools (no AI proxy)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Download only this exact original run's channel render artifact
        uses: actions/download-artifact@v4
        with:
          name: nine-replacements-visual-v2-${{ matrix.channel }}-review-20261108
          run-id: 42449154499
          github-token: ${{ github.token }}
          path: cloud-nine-visual-replacements-v2-20261108/${{ matrix.channel }}/
      - name: Verify all character anchors and 3 original MP4 hashes then privately stage
        env:
          REPLACEMENTS_PRIVATE_STAGE_APPROVED: 'yes'
          REPLACEMENTS_CHANNEL: ${{ matrix.channel }}
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.secret] }}
        run: python scripts/nine_visual_replacements_v2_upload_20261108.py --channel ${{ matrix.channel }} --action upload
      - name: Retain confirmed Youtube replacement IDs, old videos preserved, no public changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nine-v2-${{ matrix.channel }}-private-replacement-receipts-20261108
          path: cloud-nine-visual-replacements-v2-20261108/${{ matrix.channel }}/youtube-v2-private-upload-receipts.json
          retention-days: 7
          if-no-files-found: ignore
