name: Kids Emanuelly - Reference Photo Pipeline

on:
  pull_request:
    paths:
      - "scripts/serie_kids_emanuelly_v1.py"
      - "scripts/kids_musicas_fundo_v1.py"
      - "scripts/produzir_piloto_canais_v3.py"
      - "motion-remotion/src/kids-background-music.tsx"
      - "motion-remotion/src/pilot-short.tsx"
      - "tests/test_kids_musicas_fundo_v1.py"
      - "tests/test_kids_narracao_acolhedora_v1.py"
      - "scripts/organizar_videos_por_canal.py"
      - "motion-remotion/src/emanuelly-short.tsx"
      - "motion-remotion/src/emanuelly-layer-stage.tsx"
      - "scripts/kids_emanuelly_cenarios_camadas_v1.py"
      - "scripts/kids_fofinho_storyboards_v2.py"
      - "scripts/kids_emanuelly_series_assets_v2.py"
      - "scripts/kids_emanuelly_todos_videos_v2.py"
      - "tests/test_kids_fofinho_todos_videos_v2.py"
      - "animar-emanuelly.ps1"
      - "tests/test_kids_emanuelly_cenarios_camadas_v1.py"
      - "tests/test_animar_emanuelly_powershell.ps1"
      - "motion-remotion/src/root.tsx"
      - "motion-remotion/package.json"
      - "gerar-historia-kids.ps1"
      - "tests/test_serie_kids_emanuelly_v1.py"
      - "scripts/kids_emanuelly_continuidade_v2.py"
      - "tests/test_kids_emanuelly_continuidade_v2.py"
      - "tests/test_gerar_historia_kids_powershell.ps1"
      - ".github/workflows/kids-emanuelly-gerador.yml"
  push:
    branches: [main]
    paths:
      - "scripts/serie_kids_emanuelly_v1.py"
      - "scripts/kids_musicas_fundo_v1.py"
      - "scripts/produzir_piloto_canais_v3.py"
      - "motion-remotion/src/kids-background-music.tsx"
      - "motion-remotion/src/pilot-short.tsx"
      - "tests/test_kids_musicas_fundo_v1.py"
      - "tests/test_kids_narracao_acolhedora_v1.py"
      - "scripts/organizar_videos_por_canal.py"
      - "motion-remotion/src/emanuelly-short.tsx"
      - "motion-remotion/src/emanuelly-layer-stage.tsx"
      - "scripts/kids_emanuelly_cenarios_camadas_v1.py"
      - "scripts/kids_fofinho_storyboards_v2.py"
      - "scripts/kids_emanuelly_series_assets_v2.py"
      - "scripts/kids_emanuelly_todos_videos_v2.py"
      - "tests/test_kids_fofinho_todos_videos_v2.py"
      - "animar-emanuelly.ps1"
      - "tests/test_kids_emanuelly_cenarios_camadas_v1.py"
      - "tests/test_animar_emanuelly_powershell.ps1"
      - "motion-remotion/src/root.tsx"
      - "motion-remotion/package.json"
      - "gerar-historia-kids.ps1"
      - "tests/test_serie_kids_emanuelly_v1.py"
      - "scripts/kids_emanuelly_continuidade_v2.py"
      - "tests/test_kids_emanuelly_continuidade_v2.py"
      - "tests/test_gerar_historia_kids_powershell.ps1"
      - ".github/workflows/kids-emanuelly-gerador.yml"

permissions:
  contents: read

jobs:
  python-reference-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local isolated test packages
        run: python -m pip install 'pytest>=8,<10' 'Pillow>=10,<13' 'numpy>=1.24,<3' 'requests>=2.31,<3'
      - name: Confirm cast continuity, both Kids soundtracks, narration, image budgets and QA
        run: python -m pytest -q tests/test_serie_kids_emanuelly_v1.py tests/test_kids_emanuelly_continuidade_v2.py tests/test_kids_emanuelly_cenarios_camadas_v1.py tests/test_kids_fofinho_todos_videos_v2.py tests/test_kids_musicas_fundo_v1.py tests/test_kids_narracao_acolhedora_v1.py tests/test_kids_emanuelly_serie.py tests/test_organizar_videos_por_canal.py
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Remotion
        working-directory: motion-remotion
        run: npm install --no-audit --no-fund
      - name: Check Emanuelly composition and existing compositions
        working-directory: motion-remotion
        run: npm run typecheck
  powershell-windows:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Mock invoke PowerShell with no images generated and no upload
        shell: powershell
        run: |
          .\tests\test_gerar_historia_kids_powershell.ps1
          .\tests\test_animar_emanuelly_powershell.ps1
