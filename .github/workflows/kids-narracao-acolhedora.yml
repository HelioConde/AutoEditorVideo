name: Kids - Narracao Acolhedora e pausas reais

on:
  pull_request:
    paths:
      - "conteudos/piloto-games-kids-3x2-v3.json"
      - "scripts/kids_narracao_acolhedora_v1.py"
      - "scripts/piloto_canais_3x2_v3.py"
      - "scripts/produzir_piloto_canais_v3.py"
      - "motion-remotion/src/pilot-short.tsx"
      - "kids-narracao-acolhedora.ps1"
      - "tests/test_kids_narracao_acolhedora_v1.py"
      - "tests/test_kids_narracao_acolhedora_launcher.ps1"
      - ".github/workflows/kids-narracao-acolhedora.yml"
  push:
    branches: [main]
    paths:
      - "conteudos/piloto-games-kids-3x2-v3.json"
      - "scripts/kids_narracao_acolhedora_v1.py"
      - "scripts/piloto_canais_3x2_v3.py"
      - "scripts/produzir_piloto_canais_v3.py"
      - "motion-remotion/src/pilot-short.tsx"
      - "kids-narracao-acolhedora.ps1"
      - "tests/test_kids_narracao_acolhedora_v1.py"
      - "tests/test_kids_narracao_acolhedora_launcher.ps1"
      - ".github/workflows/kids-narracao-acolhedora.yml"

permissions:
  contents: read

jobs:
  kids-pacing-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'pytest>=8,<10'
      - name: Verify script, PCM silences, caption timing, backups and 60s gate
        run: python -m pytest -q tests/test_kids_narracao_acolhedora_v1.py tests/test_piloto_canais_3x2_v3.py
  kids-pacing-remotion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Remotion (no rendering/TTS)
        run: npm install --no-audit --no-fund
        working-directory: motion-remotion
      - name: Verify typed 13 cue visual animation
        run: npm run typecheck
        working-directory: motion-remotion
  kids-pacing-windows:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Mock test of Kids PowerShell, no network/TTS/upload
        shell: powershell
        run: .\tests\test_kids_narracao_acolhedora_launcher.ps1
