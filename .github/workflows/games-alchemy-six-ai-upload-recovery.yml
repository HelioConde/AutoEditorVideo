name: Gamer + Alchemy - upload rendered six AI Shorts from original run

on:
  workflow_run:
    workflows:
      - 'Gamer + Alchemy - six AI-illustrated Shorts one-shot'
    types: [completed]

permissions:
  contents: read

concurrency:
  group: games-alchemy-ai-six-pinned-youtube-private-20261105
  cancel-in-progress: false

jobs:
  verify-original-render-and-main-protection:
    if: >-
      github.event.workflow_run.id == 42044136670 &&
      github.event.workflow_run.head_sha == 'a414b9aea8d778f27c765cfb3d45e94612d0ee05' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original image/MP4 job succeeded and Youtube Environment is main-only, no Secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/games_alchemy_ai_recovery_gate.py

  upload-gamer:
    needs: verify-original-render-and-main-protection
    if: needs.verify-original-render-and-main-protection.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Google API dependencies without secrets
        run: python -m pip install -r requirements-publicacao.txt
      - uses: actions/download-artifact@v4
        with:
          name: games-alchemy-six-ai-render
          run-id: 42044136670
          github-token: ${{ github.token }}
          path: cloud-games-alchemy-ai-six/
      - name: Upload only Gamer trio as private, verify exact YouTube ID
        env:
          AI_SIX_PILOT_USER_APPROVED: 'true'
          AI_SIX_PILOT_ORIGINAL_RUN_ID: '42044136670'
          AI_SIX_PILOT_ORIGINAL_SHA: 'a414b9aea8d778f27c765cfb3d45e94612d0ee05'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_GAMES_TOKEN_JSON }}
        run: python scripts/games_alchemy_ai_upload.py --channel games
      - name: Preserve private video IDs, even if upload step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-ai-gamer-private-receipts
          path: cloud-games-alchemy-ai-six/games-youtube-private-receipts.json
          retention-days: 7
          if-no-files-found: ignore

  upload-alchemy:
    needs: verify-original-render-and-main-protection
    if: needs.verify-original-render-and-main-protection.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Google API dependencies without secrets
        run: python -m pip install -r requirements-publicacao.txt
      - uses: actions/download-artifact@v4
        with:
          name: games-alchemy-six-ai-render
          run-id: 42044136670
          github-token: ${{ github.token }}
          path: cloud-games-alchemy-ai-six/
      - name: Upload only Alchemy trio as private, verify exact YouTube ID
        env:
          AI_SIX_PILOT_USER_APPROVED: 'true'
          AI_SIX_PILOT_ORIGINAL_RUN_ID: '42044136670'
          AI_SIX_PILOT_ORIGINAL_SHA: 'a414b9aea8d778f27c765cfb3d45e94612d0ee05'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_ALCHEMY_TOKEN_JSON }}
        run: python scripts/games_alchemy_ai_upload.py --channel alchemy
      - name: Preserve private video IDs, even if upload step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-ai-alchemy-private-receipts
          path: cloud-games-alchemy-ai-six/alchemy-youtube-private-receipts.json
          retention-days: 7
          if-no-files-found: ignore
