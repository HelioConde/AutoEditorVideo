name: AutoEditorVideo - publish batch15 reviewed videos publicly

on:
  workflow_run:
    workflows:
      - AutoEditorVideo - 15 new Shorts BR EN Gamer Kids Alchemy private-first
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: batch15-public-publish-exact-source-42481839933
  cancel-in-progress: false

jobs:
  verify-source-public-approval:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.id == 42481839933 &&
      github.event.workflow_run.head_sha == '49bdeaf75201ce2bc363836b4ac9ee4dbc19f0b6' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.run_attempt == 1 &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact creator public approval, canonical IDs and no reupload
        run: |
          python -m py_compile scripts/batch15_publicize_reviewed_20261108.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('conteudos/lote-15-public-approval-20261108.json').read_text(encoding='utf-8'))
          assert d['source_run_id']==42481839933
          assert d['creator_publication_authorized'] is True
          assert d['reviewed_channels']==['games','kids','alchemy']
          assert d['original_videos_untouched'] is True
          assert d['no_blind_reupload'] is True
          assert d['kids_made_for_kids'] is True
          source=Path('scripts/batch15_publicize_reviewed_20261108.py').read_text(encoding='utf-8')
          assert 'videos().insert' not in source
          assert 'videos().delete' not in source
          assert 'videos().update' in source
          print('BATCH15_PUBLIC_APPROVAL_AND_NO_INSERT_TESTS_PASSED')
          PY
      - name: Verify main-only protected YouTube secrets before using them
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/youtube_env_policy_guard.py

  publish-nine-reviewed-private-uploads:
    needs: verify-source-public-approval
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - channel: games
            token_secret: YOUTUBE_GAMES_TOKEN_JSON
          - channel: kids
            token_secret: YOUTUBE_KIDS_TOKEN_JSON
          - channel: alchemy
            token_secret: YOUTUBE_ALCHEMY_TOKEN_JSON
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal Google YouTube API authorized editing client
        run: python -m pip install -r requirements-publicacao.txt
      - name: Obtain exact original one-shot channel's actual YouTube upload receipts
        uses: actions/download-artifact@v4
        with:
          name: batch15-${{ matrix.channel }}-private-youtube-receipts-20261108
          run-id: 42481839933
          github-token: ${{ github.token }}
          path: cloud-lote-15-canais-20261108/${{ matrix.channel }}/
      - name: Update existing videos to PUBLIC only with verified edit permission and channel identity
        env:
          BATCH15_PUBLIC_CHANNEL: ${{ matrix.channel }}
          BATCH15_PUBLIC_AUTHORIZED: 'yes'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.token_secret] }}
        run: python scripts/batch15_publicize_reviewed_20261108.py --channel ${{ matrix.channel }} --action publish
      - name: Preserve confirmed PUBLIC IDs and explicit errors, never secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch15-${{ matrix.channel }}-public-youtube-verification-20261108
          path: cloud-lote-15-canais-20261108/${{ matrix.channel }}/public-transition-receipts.json
          retention-days: 7
          if-no-files-found: ignore
