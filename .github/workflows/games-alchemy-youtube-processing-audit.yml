name: Gamer + Alchemy - read only YouTube processing status audit
on:
  push:
    branches: [main]
    paths:
      - 'conteudos/games-alchemy-youtube-processing-audit-20261105.json'
permissions:
  contents: read
concurrency:
  group: gamer-alchemy-processing-status-audit-20261105
  cancel-in-progress: false
jobs:
  audit-owned-upload-processing:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'chore(diagnostics): inspect 12 existing YouTube processing states read-only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: youtube-private-upload
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: games
            oauth_secret: YOUTUBE_GAMES_TOKEN_JSON
          - channel: alchemy
            oauth_secret: YOUTUBE_ALCHEMY_TOKEN_JSON
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YouTube read-only API dependency
        run: python -m pip install -r requirements-publicacao.txt
      - name: Query uploadStatus, processingDetails, contentDetails and fileDetails; no writes
        env:
          READ_ONLY_PROCESSING_AUDIT_APPROVED: 'true'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.oauth_secret] }}
        run: python scripts/games_alchemy_youtube_processing_audit.py --channel ${{ matrix.channel }}
      - name: Store read-only diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamer-alchemy-youtube-processing-audit-${{ matrix.channel }}
          path: youtube-v3-v4-processing-audit/${{ matrix.channel }}.json
          if-no-files-found: warn
          retention-days: 5
