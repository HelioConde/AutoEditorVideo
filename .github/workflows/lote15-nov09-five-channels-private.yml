name: AutoEditorVideo - 15 fresh Shorts five channels Nov 09 private

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/lote-15-canais-20261109-launch.json'

permissions:
  contents: read

concurrency:
  group: nov09-fifteen-unique-shorts-private-first
  cancel-in-progress: false

jobs:
  editorial-preflight:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'feat(batch15): launch Nov 9 15 private-first videos'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact 15 new reserved stories and original pipeline
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'Pillow>=10,<13'
          python -m py_compile scripts/lote15_nov09_20261109.py scripts/five_channel_fifteen_20261108.py scripts/five_channel_fifteen_upload_20261108.py
          for channel in br en games kids alchemy; do
            python scripts/lote15_nov09_20261109.py --channel "$channel" --action validate
          done

  verify-image-environment:
    needs: editorial-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce protected image-generation Environment restricted to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/image_env_policy_guard.py

  verify-youtube-environment:
    needs: editorial-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce protected youtube-private-upload Environment restricted to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/youtube_env_policy_guard.py

  render:
    needs: [editorial-preflight, verify-image-environment]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: [br, en, games, kids, alchemy]
    runs-on: ubuntu-24.04
    timeout-minutes: 245
    environment: image-generation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned native image provider proxy
        uses: actions/checkout@v4
        with:
          repository: 10/chatgpt-codex-proxy
          ref: 1da5476e46ef62830d7016de2a931b0b8270a6c4
          path: pinned-native-go-proxy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion-remotion/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: pinned-native-go-proxy/go.mod
          cache: false
      - name: Install original AutoEditorVideo media toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-master.txt 'edge-tts>=7,<9' 'Pillow>=10,<13'
      - name: Compile original canonical Remotion renderer
        working-directory: motion-remotion
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Compile pinned native image proxy before loading image credentials
        working-directory: pinned-native-go-proxy
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/nov09-native-proxy" ./cmd/api
      - name: Render 3 distinct original videos with gpt-image-2
        shell: bash
        env:
          PROXY_ACCOUNTS_JSON: ${{ secrets.PROXY_ACCOUNTS_JSON }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
          IMAGE_MODEL: gpt-image-2
          BATCH15_CHANNEL: ${{ matrix.channel }}
          BATCH15_RENDER_AUTHORIZED: 'yes'
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/nov09-${BATCH15_CHANNEL}-proxy"
          mkdir -m 700 "$private_dir"
          proxy_pid=''
          cleanup() {
            if [[ -n "$proxy_pid" ]]; then kill "$proxy_pid" 2>/dev/null || true; fi
            rm -rf -- "$private_dir"
            rm -f -- "$RUNNER_TEMP/nov09-${BATCH15_CHANNEL}-proxy.log"
          }
          trap cleanup EXIT
          python scripts/proxy_accounts_private_stage.py "$private_dir"
          unset PROXY_ACCOUNTS_JSON
          DATA_DIR="$private_dir" DEBUG_LOG_PAYLOADS=false GIN_MODE=release PORT=8080 \
            "$RUNNER_TEMP/nov09-native-proxy" >"$RUNNER_TEMP/nov09-${BATCH15_CHANNEL}-proxy.log" 2>&1 &
          proxy_pid=$!
          python scripts/lote15_nov09_20261109.py --channel "$BATCH15_CHANNEL" --action render
          echo "NOV09_RENDER_THREE_COMPLETED_${BATCH15_CHANNEL}"
      - name: Preserve original MP4s, official covers, storyboard and technical QA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nov09-three-original-media-${{ matrix.channel }}
          path: |
            cloud-lote-15-canais-20261109/${{ matrix.channel }}/summary.json
            cloud-lote-15-canais-20261109/${{ matrix.channel }}/**/final.mp4
            cloud-lote-15-canais-20261109/${{ matrix.channel }}/**/thumb.jpg
            cloud-lote-15-canais-20261109/${{ matrix.channel }}/**/qa.json
            cloud-lote-15-canais-20261109/${{ matrix.channel }}/**/metadata.json
            cloud-lote-15-canais-20261109/${{ matrix.channel }}/**/scene-*.png
          retention-days: 7
          if-no-files-found: error

  upload-private:
    needs: [editorial-preflight, verify-youtube-environment, render]
    if: >-
      needs.editorial-preflight.result == 'success' &&
      needs.verify-youtube-environment.result == 'success' &&
      needs.render.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - channel: br
            token_secret: YOUTUBE_BR_TOKEN_JSON
          - channel: en
            token_secret: YOUTUBE_EN_TOKEN_JSON
          - channel: games
            token_secret: YOUTUBE_GAMES_TOKEN_JSON
          - channel: kids
            token_secret: YOUTUBE_KIDS_TOKEN_JSON
          - channel: alchemy
            token_secret: YOUTUBE_ALCHEMY_TOKEN_JSON
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: youtube-private-upload
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original YouTube upload and technical validation libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Download exact three original MP4s from this GitHub Action run
        uses: actions/download-artifact@v4
        with:
          name: nov09-three-original-media-${{ matrix.channel }}
          path: cloud-lote-15-canais-20261109/${{ matrix.channel }}/
      - name: Verify channel OAuth and insert only previously absent original videos PRIVATELY
        env:
          BATCH15_CHANNEL: ${{ matrix.channel }}
          BATCH15_PRIVATE_UPLOAD_AUTHORIZED: 'yes'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.token_secret] }}
        run: python scripts/lote15_nov09_20261109.py --channel "${{ matrix.channel }}" --action upload
      - name: Preserve verified IDs or partial receipts without exposing credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nov09-private-youtube-receipts-${{ matrix.channel }}
          path: cloud-lote-15-canais-20261109/${{ matrix.channel }}/youtube-private-receipts.json
          retention-days: 7
          if-no-files-found: ignore
