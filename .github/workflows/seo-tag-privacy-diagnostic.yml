name: Gamer + Alchemy - read-only tag and privacy diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'conteudos/seo-tag-privacy-check-20261105.json'
permissions:
  contents: read
jobs:
  inspect:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'chore(seo): inspect channel privacy before cleaning six tags'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: youtube-private-upload
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: games
            secret: YOUTUBE_GAMES_TOKEN_JSON
          - channel: alchemy
            secret: YOUTUBE_ALCHEMY_TOKEN_JSON
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only Google API dependencies
        run: python -m pip install -r requirements-publicacao.txt
      - name: Show exact original owner and privacy for six specific IDs; NO writes
        env:
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.secret] }}
        run: python scripts/audit_six_youtube_tag_privacy.py --channel ${{ matrix.channel }}
      - name: Retain read-only findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-tag-privacy-${{ matrix.channel }}
          path: seo-tag-privacy-diagnostic/${{ matrix.channel }}.json
          retention-days: 5
          if-no-files-found: ignore
