name: Emanuelly Kids - 3 original static 90s Shorts private upload

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/kids-static-90s-launch-20261107.json'

permissions:
  contents: read

concurrency:
  group: kids-20261107-original-stills-one-shot
  cancel-in-progress: false

jobs:
  offline-scripts-and-editorial:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'feat(kids): launch three original static 90s Shorts for private upload'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax, reservations, original stories, official Kids covers
        run: |
          python -m pip install 'Pillow>=10,<13' 'pytest>=8,<10'
          python -m py_compile scripts/kids_static_90s_20261107.py scripts/kids_static_90s_upload_20261107.py scripts/capa_cinematografica.py
          python -m pytest -q tests/test_kids_static_90s_20261107.py
          python scripts/kids_static_90s_20261107.py --action validate
          python scripts/kids_static_90s_upload_20261107.py --action preflight
      - name: Validate one-time user launch authorization for private made-for-kids ONLY
        run: |
          python - <<'PY'
          import json
          d=json.load(open('conteudos/kids-static-90s-launch-20261107.json',encoding='utf-8'))
          assert d == {
            'schema':'autoeditorvideo/kids-static-90s-one-shot-launch/v1',
            'user_authorized_at':'2026-11-07',
            'original_manifest':'conteudos/lote-12-estatico-90s-20261107.json',
            'channel':'kids',
            'channel_id':'UCxEzVW2Uy44OUVurTQSg_Eg',
            'episode_ids':['kids-101-elefantinho-agua-escondida','kids-102-quiz-sombras-animais','kids-103-dinos-segredos-incriveis'],
            'max_ai_image_requests':24,
            'render_mode':'original_autoeditorvideo_static_no_deformation',
            'voice_duration_min_seconds':90,
            'voice_duration_max_seconds':120,
            'upload_initial_privacy':'private',
            'made_for_kids':True,
            'fofinhos_series_excluded':True,
            'no_retries_on_uncertain_video_upload':True
          }
          print('KIDS_ONE_SHOT_AUTHORIZATION_VALIDATED')
          PY

  verify-image-environment:
    needs: offline-scripts-and-editorial
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm protected image Environment before secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/image_env_policy_guard.py

  verify-youtube-environment:
    needs: offline-scripts-and-editorial
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm shared YouTube Environment main-only policy (no OAuth)
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os
          from youtube_new_channels_env_guard import fetch_protected_policy, policy_is_main_only
          env,policy=fetch_protected_policy('kids',os.environ.get('GH_TOKEN',''))
          policy_is_main_only('kids',env,policy)
          print('KIDS_YOUTUBE_MAIN_ONLY_ENV_OK_NO_SECRETS_USED')
          PY

  render-three-kids:
    needs: [offline-scripts-and-editorial, verify-image-environment]
    runs-on: ubuntu-24.04
    timeout-minutes: 245
    environment: image-generation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned original Go image proxy
        uses: actions/checkout@v4
        with:
          repository: 10/chatgpt-codex-proxy
          ref: 1da5476e46ef62830d7016de2a931b0b8270a6c4
          path: pinned-native-go-proxy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion-remotion/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: pinned-native-go-proxy/go.mod
          cache: false
      - name: Install original AutoEditorVideo FFmpeg, Edge TTS and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-master.txt 'edge-tts>=7,<9' 'Pillow>=10,<13'
      - name: Install and typecheck ORIGINAL Remotion renderer
        working-directory: motion-remotion
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Compile pinned native Go proxy without secrets
        working-directory: pinned-native-go-proxy
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/kids-static-native-proxy" ./cmd/api
      - name: Generate 3 real 90-120s MP4, 24 original static illustrations and official Kids covers
        shell: bash
        env:
          PROXY_ACCOUNTS_JSON: ${{ secrets.PROXY_ACCOUNTS_JSON }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
          IMAGE_MODEL: gpt-image-2
          MAX_IMAGE_CALLS: '24'
          KIDS_BATCH_AUTHORIZED: 'yes'
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/kids-static-20261107-proxy-state"
          test ! -e "$private_dir"
          mkdir -m 700 "$private_dir"
          proxy_pid=''
          cleanup() {
            if [[ -n "$proxy_pid" ]]; then kill "$proxy_pid" 2>/dev/null || true; fi
            rm -rf -- "$private_dir"
            rm -f -- "$RUNNER_TEMP/kids-static-proxy.log"
          }
          trap cleanup EXIT
          python scripts/proxy_accounts_private_stage.py "$private_dir"
          unset PROXY_ACCOUNTS_JSON
          DATA_DIR="$private_dir" DEBUG_LOG_PAYLOADS=false GIN_MODE=release PORT=8080 \
            "$RUNNER_TEMP/kids-static-native-proxy" > "$RUNNER_TEMP/kids-static-proxy.log" 2>&1 &
          proxy_pid=$!
          python scripts/kids_static_90s_20261107.py --action render
          echo "KIDS_3_STATIC_MP4_QA_FINISHED_NO_YOUTUBE_OAUTH"
      - name: Store only final media and validated QA, never private proxy state
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: emanuelly-kids-static-three-mp4-20261107
          path: |
            cloud-kids-static-20261107/summary.json
            cloud-kids-static-20261107/**/final.mp4
            cloud-kids-static-20261107/**/thumb.jpg
            cloud-kids-static-20261107/**/qa.json
            cloud-kids-static-20261107/**/metadata.json
          retention-days: 7
          if-no-files-found: error

  upload-three-kids-private:
    needs: [render-three-kids, verify-youtube-environment]
    if: >-
      needs.render-three-kids.result == 'success' &&
      needs.verify-youtube-environment.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: youtube-private-upload
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official YouTube uploader and ffprobe, no secrets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Download exact same-run 3 finished MP4, covers and SHA256 checks
        uses: actions/download-artifact@v4
        with:
          name: emanuelly-kids-static-three-mp4-20261107
          path: cloud-kids-static-20261107/
      - name: Verify kids Google channel ID and send each SHORT privately, Made for Kids
        env:
          KIDS_UPLOAD_AUTHORIZED: 'yes'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_KIDS_TOKEN_JSON }}
        run: python scripts/kids_static_90s_upload_20261107.py --action upload
      - name: Save every actual YouTube ID even if later cover or upload fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emanuelly-kids-youtube-private-upload-receipts-20261107
          path: cloud-kids-static-20261107/kids-private-youtube-receipts.json
          retention-days: 7
          if-no-files-found: ignore
