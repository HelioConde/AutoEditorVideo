name: Otaku Multicena - plano multiplataforma offline

on:
  pull_request:
    paths:
      - "scripts/plano_multiplataforma_v3.py"
      - "scripts/otaku_growth_v3.py"
      - "scripts/metadata_shorts.py"
      - "tests/test_plano_multiplataforma_v3.py"
      - ".github/workflows/otaku-multiplatform-growth-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/plano_multiplataforma_v3.py"
      - "scripts/otaku_growth_v3.py"
      - "scripts/metadata_shorts.py"
      - "tests/test_plano_multiplataforma_v3.py"
      - ".github/workflows/otaku-multiplatform-growth-tests.yml"

permissions:
  contents: read

jobs:
  editorial-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Testar planejamento sem IA, credenciais ou upload
        run: python -m pytest -q tests/test_plano_multiplataforma_v3.py
