name: Emanuelly Kids - reconcile one already-uploaded Elefantinho ID
on:
  push:
    branches: [main]
    paths:
      - 'conteudos/kids-elefantinho-existing-id-reconcile-retry-20261108.json'
permissions:
  contents: read
concurrency:
  group: kids-elefantinho-new-id-zl0Rw482XRw-reconcile-single-flight
  cancel-in-progress: false
jobs:
  guard-original-upload-and-policy:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'fix(kids): rerun existing Elefantinho video id reconciliation after Pillow dependency fix'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm no upload/delete operations in existing new Kids ID reconciliation
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m py_compile scripts/kids_elefantinho_existing_id_reconcile_20261108.py
          python scripts/kids_elefantinho_existing_id_reconcile_20261108.py --action preflight
          python - <<'PY'
          from pathlib import Path
          c=Path('scripts/kids_elefantinho_existing_id_reconcile_20261108.py').read_text()
          assert 'NEW_ID="zl0Rw482XRw"' in c
          assert 'OLD_ID' in c
          assert 'videos().insert(' not in c and 'videos().delete(' not in c
          assert 'selfDeclaredMadeForKids' in c
          print('ONE_KIDS_KNOWN_ID_RECONCILIATION_NO_DUPLICATE_PROVED')
          PY
      - name: Verify protected main-only YouTube Environment
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os
          from youtube_new_channels_env_guard import fetch_protected_policy,policy_is_main_only
          x,p=fetch_protected_policy('kids',os.environ['GH_TOKEN'])
          policy_is_main_only('kids',x,p)
          print('KIDS_RECONCILE_OAUTH_ENV_PROTECTED')
          PY
  reconcile-existing-youtube-id:
    needs: guard-original-upload-and-policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: youtube-private-upload
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google YouTube API
        run: python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Fetch SHA256-locked original thumbnail and metadata only
        uses: actions/download-artifact@v4
        with:
          name: emanuelly-kids-static-three-mp4-20261107
          run-id: 42393346725
          github-token: ${{ github.token }}
          path: cloud-kids-static-20261107/
      - name: Read exact new Kids video ID from API; verify public processed madeForKids and apply original cover
        env:
          KIDS_ELEFANTINHO_EXISTING_ID_READ_AND_COVER: 'yes'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_KIDS_TOKEN_JSON }}
        run: python scripts/kids_elefantinho_existing_id_reconcile_20261108.py --action reconcile
      - name: Preserve current video state and processing result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-elefantinho-new-ID-only-processed-status-20261108
          path: kids-elefantinho-v2-only-reconcile-result.json
          retention-days: 7
          if-no-files-found: ignore
