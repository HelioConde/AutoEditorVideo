name: Cloud credentials - real OAuth read-only probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloud-credentials-probe.yml'
      - 'scripts/cloud_credentials_probe.py'
      - 'tests/test_cloud_credentials_probe.py'

# Secrets are only consumed after code has been merged into trusted main.
# No pull_request trigger; never run untrusted PR code with YouTube secrets.
permissions:
  contents: read

concurrency:
  group: read-only-oauth-probe
  cancel-in-progress: false

jobs:
  oauth-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal OAuth clients
        run: python -m pip install 'google-auth>=2,<3' 'requests>=2.31,<3'
      - name: Refresh OAuth and verify channel read-only permissions
        env:
          YOUTUBE_OAUTH_CLIENT_JSON: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON }}
          YOUTUBE_BR_TOKEN_JSON: ${{ secrets.YOUTUBE_BR_TOKEN_JSON }}
          YOUTUBE_EN_TOKEN_JSON: ${{ secrets.YOUTUBE_EN_TOKEN_JSON }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
        run: python scripts/cloud_credentials_probe.py
