name: Gamer - 5 second native cover and highlighted captions test

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/gamer-reference-style-5s-run-20261105.json'

permissions:
  contents: read

concurrency:
  group: gamer-five-second-reference-visual-only-once-20261105
  cancel-in-progress: false

jobs:
  offline-design-qa:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'feat(gamer): render and privately upload one 5s approved style test'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight offline QA dependencies
        run: python -m pip install 'pytest>=8,<10' 'Pillow>=10,<13'
      - name: Validate reserved 5s episode and actual official cover generator
        run: |
          python -m pytest -q tests/test_gamer_reference_style_5s.py
          python scripts/gamer_reference_style_5s.py --action validate
          python -m py_compile scripts/gamer_reference_style_5s.py scripts/gamer_reference_style_5s_upload.py

  render-reference-5s:
    needs: offline-design-qa
    if: needs.offline-design-qa.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion-remotion/package-lock.json
      - name: Install FFmpeg and approved title fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Install Edge word-boundary TTS and PIL without image-model credentials
        run: python -m pip install 'edge-tts>=7,<9' 'Pillow>=10,<13'
      - name: Use the existing AutoEditorVideo native Remotion renderer
        working-directory: motion-remotion
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Reuse already-created AI art only (no new image generation)
        uses: actions/download-artifact@v4
        with:
          name: games-alchemy-six-ai-render
          run-id: 42044136670
          github-token: ${{ github.token }}
          path: source-games-alchemy-six/
      - name: Render exactly 5 seconds with official program cover and reference word highlighting
        env:
          STYLE_5S_APPROVED: 'true'
          SOURCE_RENDER_RUN_ID: '42044136670'
        run: python scripts/gamer_reference_style_5s.py --action render
      - name: Save 5s video, official cover and quality receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gamer-native-reference-five-second-test
          path: gamer-reference-style-5s/
          if-no-files-found: error
          retention-days: 7

  privately-upload-reference-5s:
    needs: [offline-design-qa, render-reference-5s]
    if: needs.render-reference-5s.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google's official YouTube API client before OAuth secrets
        run: python -m pip install -r requirements-publicacao.txt
      - uses: actions/download-artifact@v4
        with:
          name: gamer-native-reference-five-second-test
          path: gamer-reference-style-5s/
      - name: Verify exact Gamer ID and upload only the NEW 5s private visual test
        env:
          STYLE_5S_PRIVATE_UPLOAD_APPROVED: 'true'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_GAMES_TOKEN_JSON }}
        run: python scripts/gamer_reference_style_5s_upload.py
      - name: Save known YouTube ID even when a thumbnail step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamer-native-5s-private-youtube-receipt
          path: gamer-reference-style-5s/gamer-private-5s-upload-receipt.json
          retention-days: 7
          if-no-files-found: ignore
