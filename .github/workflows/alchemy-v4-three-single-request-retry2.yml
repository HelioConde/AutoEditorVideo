name: Alchemy - retry three Shorts with single-request upload
on:
  push:
    branches: [main]
    paths:
      - 'conteudos/alchemy-v4-single-request-retry2-20261105.json'
permissions:
  contents: read
concurrency:
  group: alchemy-v4-exact-three-retry2-20261105
  cancel-in-progress: false
jobs:
  verify-only-alchemy:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'fix(alchemy): resume three V4 uploads using single request after pending draft check'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact Alchemy scope, channel identity and no-write prior failure
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_alchemy_v4_single_request_retry2.py
          python -m py_compile scripts/alchemy_v4_single_request_retry2.py

  resend-three-alchemy:
    needs: verify-only-alchemy
    if: needs.verify-only-alchemy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official YouTube API libraries
        run: python -m pip install -r requirements-publicacao.txt
      - name: Download only original V4 files, no new image generation
        uses: actions/download-artifact@v4
        with:
          name: gamer-alchemy-reference-v4-six
          run-id: 42074829801
          github-token: ${{ github.token }}
          path: alchemy-source-v4/
      - name: Send exactly three Alchemy Shorts privately; single-request upload and official covers
        env:
          ALCHEMY_V4_RETRY_APPROVED: 'true'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_ALCHEMY_TOKEN_JSON }}
        run: python scripts/alchemy_v4_single_request_retry2.py
      - name: Preserve partial receipts even if YouTube returns an uncertain response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-three-v4-nonresumable-retry2-receipts
          path: alchemy-v4-retry-receipts.json
          if-no-files-found: ignore
          retention-days: 7
