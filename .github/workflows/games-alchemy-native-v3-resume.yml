name: Gamer + Alchemy - selectively resume four missing native V3 private Shorts
on:
  push:
    branches: [main]
    paths:
      - 'conteudos/games-alchemy-native-v3-resume-20261105.json'
permissions:
  contents: read
concurrency:
  group: gamer-alchemy-native-v3-selective-recovery-20261105
  cancel-in-progress: false
jobs:
  verify-two-existing-before-resuming:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'feat(games-alchemy): recover only missing native V3 Shorts after audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tiny offline dependencies before secrets
        run: python -m pip install 'Pillow>=10,<13'
      - name: Verify 6 V3 originals, first two accepted uploads, audit and protected environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/games_alchemy_native_v3_resume_gate.py
          python -m py_compile scripts/games_alchemy_native_v3_resume.py
  resume-private:
    needs: verify-two-existing-before-resuming
    if: needs.verify-two-existing-before-resuming.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: games
            oauth_secret: YOUTUBE_GAMES_TOKEN_JSON
          - channel: alchemy
            oauth_secret: YOUTUBE_ALCHEMY_TOKEN_JSON
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YouTube client without accessing secrets
        run: python -m pip install -r requirements-publicacao.txt
      - uses: actions/download-artifact@v4
        with:
          name: gamer-alchemy-six-native-v3
          run-id: 42058545056
          github-token: ${{ github.token }}
          path: cloud-games-alchemy-recut-v3/
      - uses: actions/download-artifact@v4
        with:
          name: native-v3-audit-${{ matrix.channel }}
          run-id: 42063706481
          github-token: ${{ github.token }}
          path: native-v3-readonly-audit/
      - name: Keep first accepted upload, add only missing V3 videos, apply program covers after 75 seconds
        env:
          V3_RECOVERY_CREATOR_APPROVED: 'true'
          SOURCE_NATIVE_RENDER_RUN_ID: '42058545056'
          ORIGINAL_FAILED_UPLOAD_RUN: '42063131990'
          READ_ONLY_AUDIT_RUN: '42063706481'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.oauth_secret] }}
        run: python scripts/games_alchemy_native_v3_resume.py --channel ${{ matrix.channel }}
      - name: Preserve all discovered private YouTube IDs even if a later upload fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-v3-recovered-private-${{ matrix.channel }}
          path: cloud-games-alchemy-recut-v3/${{ matrix.channel }}-v3-recovered-receipts.json
          retention-days: 7
          if-no-files-found: ignore
