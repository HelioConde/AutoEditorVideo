name: Publish AutoEditor Studio Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: autoeditor-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static web edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Build GitHub Pages edition (no Node backend)
        run: npm run build:web
      - name: Check the published HTML and base prefix
        run: |
          test -s dist/index.html
          grep -q '/AutoEditorVideo/assets/' dist/index.html
          test -f dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish web app
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
