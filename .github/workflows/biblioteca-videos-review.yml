name: Biblioteca de videos e revisao no YouTube

on:
  pull_request:
    paths:
      - "scripts/organizar_videos_por_canal.py"
      - "scripts/renderizar_master_remotion.py"
      - "scripts/renderizar_shorts_en.py"
      - "scripts/produzir_piloto_canais_v3.py"
      - "scripts/extract_scene_layers.py"
      - "organizar-videos.ps1"
      - "tests/test_organizar_videos_por_canal.py"
      - "tests/test_post_upload_review_policy.py"
      - "tests/test_multilayer_occlusion.py"
      - ".github/workflows/biblioteca-videos-review.yml"
  push:
    branches: [main]
    paths:
      - "scripts/organizar_videos_por_canal.py"
      - "scripts/renderizar_master_remotion.py"
      - "scripts/renderizar_shorts_en.py"
      - "scripts/produzir_piloto_canais_v3.py"
      - "scripts/extract_scene_layers.py"
      - "organizar-videos.ps1"
      - "tests/test_organizar_videos_por_canal.py"
      - "tests/test_post_upload_review_policy.py"
      - "tests/test_multilayer_occlusion.py"
      - ".github/workflows/biblioteca-videos-review.yml"

permissions:
  contents: read

jobs:
  python-archive-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local technical QA dependencies
        run: python -m pip install 'pytest>=8,<10' -r requirements-master.txt
      - name: Four channels and non-destructive storage
        run: python -m pytest -q tests/test_organizar_videos_por_canal.py
      - name: No pre-render approval clicks, but keep technical blockers
        run: python -m pytest -q tests/test_post_upload_review_policy.py tests/test_multilayer_occlusion.py tests/test_visual_review_geometry.py
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check PS syntax and preview the empty local archive
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'organizar-videos.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if($errors.Count -gt 0){
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw 'Organizador PS syntax invalid'
          }
          .\organizar-videos.ps1 -Acao Prever
