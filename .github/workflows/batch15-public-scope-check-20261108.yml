name: AutoEditorVideo - check edit scopes for five channels without exposing secrets

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/lote-15-public-scope-check-launch-20261108.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: batch15-readonly-scope-check-20261108
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'chore(batch15): inspect public metadata OAuth permissions for five channels'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: youtube-private-upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: br
            token_secret: YOUTUBE_BR_TOKEN_JSON
          - channel: en
            token_secret: YOUTUBE_EN_TOKEN_JSON
          - channel: games
            token_secret: YOUTUBE_GAMES_TOKEN_JSON
          - channel: kids
            token_secret: YOUTUBE_KIDS_TOKEN_JSON
          - channel: alchemy
            token_secret: YOUTUBE_ALCHEMY_TOKEN_JSON
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify protected main-only YouTube environment without OAuth
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/youtube_env_policy_guard.py
      - name: Report only whether video privacy editing is authorized by OAuth scopes
        env:
          BATCH15_SCOPE_CHANNEL: ${{ matrix.channel }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets[matrix.token_secret] }}
        run: |
          python - <<'PY'
          import json, os
          channel=os.environ['BATCH15_SCOPE_CHANNEL']
          raw=os.environ.get('YOUTUBE_CHANNEL_TOKEN_JSON','')
          if not raw:
            print("BATCH15_EDIT_SCOPE_"+channel+"_MISSING_TOKEN")
            raise SystemExit(0)
          data=json.loads(raw)
          scopes=data.get('scopes',[])
          scopes=set(scopes.split()) if isinstance(scopes,str) else set(scopes)
          allowed={'https://www.googleapis.com/auth/youtube',
                   'https://www.googleapis.com/auth/youtube.force-ssl',
                   'https://www.googleapis.com/auth/youtubepartner'}
          print("BATCH15_EDIT_SCOPE_"+channel+("_AUTHORIZED" if scopes & allowed else "_NOT_GRANTED"))
          PY
