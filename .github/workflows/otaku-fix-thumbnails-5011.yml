name: Otaku BR+EN 5011 - repair Shorts thumbnails without reupload

on:
  pull_request:
    paths:
      - '.github/workflows/otaku-fix-thumbnails-5011.yml'
      - 'scripts/youtube_short_thumbnail.py'
      - 'scripts/repair_5011_short_thumbnails.py'
      - 'scripts/cloud_youtube_private_5011.py'
      - 'tests/test_youtube_short_thumbnails.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/otaku-fix-thumbnails-5011.yml'
      - 'scripts/youtube_short_thumbnail.py'
      - 'scripts/repair_5011_short_thumbnails.py'
      - 'scripts/cloud_youtube_private_5011.py'
      - 'tests/test_youtube_short_thumbnails.py'

permissions:
  contents: read

concurrency:
  group: otaku-5011-repair-both-original-thumbnails
  cancel-in-progress: false

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google client and synthetic QA dependencies without Secrets
        run: python -m pip install -r requirements-publicacao.txt 'pytest>=8,<10'
      - name: Confirm thumbnails are attached only after video processing
        run: python -m pytest -q tests/test_youtube_short_thumbnails.py tests/test_cloud_youtube_private_5011.py

  check-protected-environment-and-pinned-artifact:
    needs: offline-checks
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'fix(thumbnails): repair already uploaded 5011 BR and EN')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check YouTube OAuth Environment allows only main, no Secret access
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/youtube_env_policy_guard.py
      - name: Confirm immutable original successful render and artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          run="repos/$repo/actions/runs/42013193406"
          test "$(gh api "$run" --jq .conclusion)" = "success"
          test "$(gh api "$run" --jq .head_sha)" = "e0e4686d6a7f2f7324761dd8dbe3e8e00724e2f0"
          test "$(gh api "$run" --jq .name)" = "Otaku Multicena + Otaku Reframe - 5011 BR and EN cloud render"
          gh api "$run/artifacts" --jq '.artifacts[] | select(.name=="otaku-5011-gachiakuta-BR-EN-autoeditorvideo" and (.expired|not)) | .id' | grep -Eq '^[0-9]+$'
          echo '[THUMBNAIL] VERIFIED_ORIGINAL_ARTIFACT_REPAIR_ONLY'

  repair-thumbnail-br:
    needs: [offline-checks, check-protected-environment-and-pinned-artifact]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'fix(thumbnails): repair already uploaded 5011 BR and EN')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google official uploader, no image-generation dependency
        run: python -m pip install -r requirements-publicacao.txt
      - name: Retrieve ORIGINAL verified cover JPG and SHA-256 manifest
        uses: actions/download-artifact@v4
        with:
          name: otaku-5011-gachiakuta-BR-EN-autoeditorvideo
          path: cloud-br-en-review-5011/
          github-token: ${{ github.token }}
          run-id: '42013193406'
      - name: Set ONLY original BR cover on EXISTING private Short
        env:
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_BR_TOKEN_JSON: ${{ secrets.YOUTUBE_BR_TOKEN_JSON }}
          REPAIR_ONLY_5011: 'true'
        run: python scripts/repair_5011_short_thumbnails.py --channel br
      - name: Upload only repair status, never images/credentials
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: otaku-5011-br-thumbnail-repair-status
          path: cloud-br-en-review-5011/br-5011-gachiakuta-thumbnail-repair-result.json
          retention-days: 14

  repair-thumbnail-en:
    needs: [offline-checks, check-protected-environment-and-pinned-artifact]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'fix(thumbnails): repair already uploaded 5011 BR and EN')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google official uploader, no image-generation dependency
        run: python -m pip install -r requirements-publicacao.txt
      - name: Retrieve ORIGINAL verified cover JPG and SHA-256 manifest
        uses: actions/download-artifact@v4
        with:
          name: otaku-5011-gachiakuta-BR-EN-autoeditorvideo
          path: cloud-br-en-review-5011/
          github-token: ${{ github.token }}
          run-id: '42013193406'
      - name: Set ONLY original EN cover on EXISTING private Short
        env:
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_EN_TOKEN_JSON: ${{ secrets.YOUTUBE_EN_TOKEN_JSON }}
          REPAIR_ONLY_5011: 'true'
        run: python scripts/repair_5011_short_thumbnails.py --channel en
      - name: Upload only repair status, never images/credentials
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: otaku-5011-en-thumbnail-repair-status
          path: cloud-br-en-review-5011/en-5011-gachiakuta-thumbnail-repair-result.json
          retention-days: 14
