name: Fofinhos - cenarios consistentes GPT Image 2

on:
  push:
    branches: [main]
    paths:
      - "scripts/gerar_cenarios_fofinhos_gpt_image_2.py"
      - "gerar-cenarios-fofinhos.ps1"
      - "tests/test_gerar_cenarios_fofinhos_gpt_image_2.py"
      - ".github/workflows/fofinhos-cenarios-consistentes.yml"
  pull_request:
    paths:
      - "scripts/gerar_cenarios_fofinhos_gpt_image_2.py"
      - "gerar-cenarios-fofinhos.ps1"
      - "tests/test_gerar_cenarios_fofinhos_gpt_image_2.py"
      - ".github/workflows/fofinhos-cenarios-consistentes.yml"

permissions:
  contents: read

jobs:
  offline-python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies (no AI, no secrets)
        run: python -m pip install 'pytest>=8,<10' 'Pillow>=10,<13' 'requests>=2.31,<3' 'numpy>=1.24,<3'
      - name: Test nine canonical assets, source lineage, budgets and alpha
        run: python -m pytest -q tests/test_gerar_cenarios_fofinhos_gpt_image_2.py

  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell without making any paid requests
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\gerar-cenarios-fofinhos.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
