name: Otaku Multicena - Auditoria editorial V2 (offline)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/otaku_multicena_editorial_audit.py'
      - 'scripts/otaku_multicena_strategy_plan.py'
      - 'scripts/otaku_multicena_scene_pacing.py'
      - 'scripts/otaku_multicena_quality_v3.py'
      - 'scripts/otaku_multicena_pose_qa.py'
      - 'scripts/otaku_multicena_ten_shot_plan.py'
      - 'scripts/otaku_multicena_asset_package.py'
      - 'scripts/otaku_multicena_video_qa.py'
      - 'motion-remotion/src/master-short.tsx'
      - 'scripts/otaku_br_50_maintenance_gate.py'
      - 'tests/test_otaku_multicena_editorial_audit.py'
      - 'tests/test_otaku_multicena_strategy_plan.py'
      - 'tests/test_otaku_multicena_scene_pacing.py'
      - 'tests/test_otaku_multicena_quality_v3.py'
      - 'tests/test_otaku_multicena_pose_qa.py'
      - 'tests/test_otaku_multicena_ten_shot_plan.py'
      - 'tests/test_otaku_multicena_asset_package.py'
      - 'tests/test_otaku_multicena_animes_50_v4.py'
      - 'tests/test_otaku_multicena_video_qa.py'
      - 'tests/test_otaku_br_50_maintenance.py'
      - 'conteudos/otaku-multicena-insights-editor-v2.json'
      - 'conteudos/otaku-multicena-animes-50-curadoria-v4.json'
      - 'docs/OTAKU-MULTICENA-EDITOR-QUALIDADE-V2.md'
      - 'docs/OTAKU-MULTICENA-50-ANIMES-CURADORIA-V4.md'
      - '.github/workflows/otaku-editorial-quality-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otaku-editorial-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-no-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only dependencies (no image/video/provider)
        run: python -m pip install --disable-pip-version-check pytest 'PyYAML>=6,<7' 'Pillow>=10,<13'
      - name: Verify maintenance authorization remains disabled
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.pause_requested == true and .authorized_public == false and .maintenance_complete == false and .resume_authorized_after_maintenance == false' \
            conteudos/otaku-br-50-serial-launch-20261106.json
      - name: Run offline tags and creator-consent tests
        run: python -m pytest -q tests/test_otaku_multicena_editorial_audit.py tests/test_otaku_br_50_maintenance.py tests/test_otaku_multicena_strategy_plan.py tests/test_otaku_multicena_scene_pacing.py tests/test_otaku_multicena_quality_v3.py tests/test_otaku_multicena_pose_qa.py tests/test_otaku_multicena_ten_shot_plan.py tests/test_otaku_multicena_asset_package.py tests/test_otaku_multicena_animes_50_v4.py tests/test_otaku_multicena_video_qa.py
      - name: Prepare editorial report from 50 planned Shorts (no publication)
        run: python scripts/otaku_multicena_editorial_audit.py --output "$RUNNER_TEMP/otaku-editorial-report-v2.json"
      - name: Build offline 15-topic strategy and cadence hypotheses
        run: python scripts/otaku_multicena_strategy_plan.py --output "$RUNNER_TEMP/otaku-strategy-v3.json"
      - name: Draft 10 visual shots for each of the five pending episodes
        run: python scripts/otaku_multicena_ten_shot_plan.py --numbers 5 4 3 2 1 --output "$RUNNER_TEMP/otaku-ten-shot-pending-drafts.json"
      - name: Prepare deliberately incomplete V3 asset checklists (no provider calls)
        run: python scripts/otaku_multicena_asset_package.py --numbers 5 4 3 2 1 --output "$RUNNER_TEMP/otaku-v3-asset-checklists.json"
      - name: Keep offline report for review
        uses: actions/upload-artifact@v4
        with:
          name: otaku-editorial-v2-report-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/otaku-editorial-report-v2.json
            ${{ runner.temp }}/otaku-strategy-v3.json
            ${{ runner.temp }}/otaku-ten-shot-pending-drafts.json
            ${{ runner.temp }}/otaku-v3-asset-checklists.json
          retention-days: 14
          if-no-files-found: error
