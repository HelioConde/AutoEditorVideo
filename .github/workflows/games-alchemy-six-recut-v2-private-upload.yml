name: Gamer + Alchemy - private upload six corrected v2 Shorts

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/games-alchemy-six-recut-v2-upload-20261105.json'

permissions:
  contents: read

concurrency:
  group: games-alchemy-six-recut-v2-private-upload-one-shot-20261105
  cancel-in-progress: false

jobs:
  verify-reviewed-v2-render:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'feat(recut): upload approved six revised Shorts privately'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact six revised media, owner, OAuth environment and original private videos - no secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/games_alchemy_recut_v2_upload_gate.py
          python -m py_compile scripts/games_alchemy_recut_v2_upload.py

  gamer-private-v2:
    needs: verify-reviewed-v2-render
    if: needs.verify-reviewed-v2-render.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    environment: youtube-private-upload
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google YouTube API libraries before credentials
        run: python -m pip install -r requirements-publicacao.txt
      - uses: actions/download-artifact@v4
        with:
          name: games-alchemy-six-recut-v2-preview
          run-id: 42055957229
          github-token: ${{ github.token }}
          path: cloud-games-alchemy-recut-v2/
      - name: Upload Gamer v2 privately, leave originals intact, delay thumbnail 75 seconds
        env:
          V2_CREATOR_APPROVED: 'true'
          SOURCE_RECUT_RUN_ID: '42055957229'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_GAMES_TOKEN_JSON }}
        run: python scripts/games_alchemy_recut_v2_upload.py --channel games
      - name: Retain video IDs for duplicate-safe recovery, even when upload step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamer-three-corrected-v2-private-upload-receipts
          path: cloud-games-alchemy-recut-v2/games-v2-private-upload-receipts.json
          retention-days: 7
          if-no-files-found: ignore

  alchemy-private-v2:
    needs: verify-reviewed-v2-render
    if: needs.verify-reviewed-v2-render.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    environment: youtube-private-upload
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google YouTube API libraries before credentials
        run: python -m pip install -r requirements-publicacao.txt
      - uses: actions/download-artifact@v4
        with:
          name: games-alchemy-six-recut-v2-preview
          run-id: 42055957229
          github-token: ${{ github.token }}
          path: cloud-games-alchemy-recut-v2/
      - name: Upload Alchemy v2 privately, leave originals intact, delay thumbnail 75 seconds
        env:
          V2_CREATOR_APPROVED: 'true'
          SOURCE_RECUT_RUN_ID: '42055957229'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_ALCHEMY_TOKEN_JSON }}
        run: python scripts/games_alchemy_recut_v2_upload.py --channel alchemy
      - name: Retain video IDs for duplicate-safe recovery, even when upload step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-three-corrected-v2-private-upload-receipts
          path: cloud-games-alchemy-recut-v2/alchemy-v2-private-upload-receipts.json
          retention-days: 7
          if-no-files-found: ignore
