name: AutoEditorVideo - Gamer V2 fix HTTP400 and private upload

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/gamer-v2-http400-fix-retry-launch-20261108.json'

permissions:
  contents: read

concurrency:
  group: gamer-v2-http400-fix-and-private-stage-20261108
  cancel-in-progress: false

jobs:
  offline-tests-and-exact-authorization:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'fix(gamer): rerun same-reference repair after corrected regression tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all 3 exact reserved Gamer V2 versions, previous 2 CI failures, and no-network HTTP400 repair
        run: |
          python -m pip install 'pytest>=8,<10' 'Pillow>=10,<13'
          python -m py_compile scripts/gamer_v2_edit_recovery.py scripts/nine_visual_replacements_v2_20261108.py scripts/nine_visual_replacements_v2_upload_20261108.py
          python -m pytest -q tests/test_remaining_static_90s_20261107.py tests/test_youtube_channel_registry.py tests/test_nine_visual_replacements_v2_20261108.py tests/test_gamer_v2_http400_reference_recovery_20261108.py
          python scripts/nine_visual_replacements_v2_20261108.py --channel games --action validate
          python scripts/nine_visual_replacements_v2_upload_20261108.py --channel games --action preflight
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts')
          from nine_visual_replacements_v2_20261108 import authorized_http400_launch
          assert authorized_http400_launch()
          p=Path('scripts/gamer_v2_edit_recovery.py').read_text()
          assert 'MAX_EXTRA_EDITS=6' in p
          assert 'short_reference_edit_after_http400' in p
          assert 'edit_call(master,fallback,model,key,transparent=False)' in p
          assert 'request_image(' not in p
          print('THREE_EXACT_GAMER_V2_ONE_SHOT_AND_REFERENCE_RECOVERY_AUTHORIZED')
          PY

  protected-main-only-image-environment:
    needs: offline-tests-and-exact-authorization
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce image-generation Environment main-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/image_env_policy_guard.py

  protected-main-only-youtube-environment:
    needs: offline-tests-and-exact-authorization
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify YouTube secret environment main-only before channel authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/youtube_env_policy_guard.py

  render-exact-three-gamer-with-character-anchor:
    needs: [offline-tests-and-exact-authorization, protected-main-only-image-environment]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: image-generation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout original pinned image provider proxy
        uses: actions/checkout@v4
        with:
          repository: 10/chatgpt-codex-proxy
          ref: 1da5476e46ef62830d7016de2a931b0b8270a6c4
          path: pinned-native-go-proxy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion-remotion/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: pinned-native-go-proxy/go.mod
          cache: false
      - name: Install original official voice, MP4, cover and Remotion dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-master.txt 'edge-tts>=7,<9' 'Pillow>=10,<13'
      - name: Typecheck Remotion renderer before touching provider
        working-directory: motion-remotion
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Compile pinned Go proxy before injecting protected image credentials
        working-directory: pinned-native-go-proxy
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/gamer-v2-400-fix-proxy" ./cmd/api
      - name: Generate 3 Gamer videos with EXACT reference identity and at most six additional edited scenes
        shell: bash
        env:
          PROXY_ACCOUNTS_JSON: ${{ secrets.PROXY_ACCOUNTS_JSON }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
          IMAGE_MODEL: gpt-image-2
          MAX_IMAGE_CALLS: '33'
          V2_REPLACEMENTS_RENDER_APPROVED: 'yes'
          REPLACEMENTS_HTTP400_FIX_APPROVED: 'yes'
          REPLACEMENTS_CHANNEL: games
        run: |
          set -euo pipefail
          umask 077
          staging="$RUNNER_TEMP/gamer-v2-400-fix-private-proxy"
          test ! -e "$staging"
          mkdir -m 700 "$staging"
          pid=''
          cleanup() {
            if [[ -n "$pid" ]]; then kill "$pid" 2>/dev/null || true; fi
            rm -rf -- "$staging"
            rm -f -- "$RUNNER_TEMP/gamer-v2-400-fix-proxy.log"
          }
          trap cleanup EXIT
          python scripts/proxy_accounts_private_stage.py "$staging"
          unset PROXY_ACCOUNTS_JSON
          DATA_DIR="$staging" DEBUG_LOG_PAYLOADS=false GIN_MODE=release PORT=8080 \
            "$RUNNER_TEMP/gamer-v2-400-fix-proxy" >"$RUNNER_TEMP/gamer-v2-400-fix-proxy.log" 2>&1 &
          pid=$!
          python scripts/nine_visual_replacements_v2_20261108.py --channel games --action render
          echo 'GAMER_V2_HTTP400_FIXED_3_REAL_RENDERED_MP4_READY'
      - name: Store exact MP4s, original thumbnails, 8 images per video, and reference QA provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nine-replacements-visual-v2-games-review-20261108
          path: |
            cloud-nine-visual-replacements-v2-20261108/games/summary.json
            cloud-nine-visual-replacements-v2-20261108/games/**/final.mp4
            cloud-nine-visual-replacements-v2-20261108/games/**/thumb.jpg
            cloud-nine-visual-replacements-v2-20261108/games/**/qa.json
            cloud-nine-visual-replacements-v2-20261108/games/**/metadata.json
            cloud-nine-visual-replacements-v2-20261108/games/**/character-identity-provenance.json
            cloud-nine-visual-replacements-v2-20261108/games/**/anchor-*.png
            cloud-nine-visual-replacements-v2-20261108/games/**/scene-*.png
          retention-days: 7
          if-no-files-found: error
      - name: Save partial original image edits for diagnosis if any provider error persists
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gamer-v2-http400-partial-scene-evidence-20261108
          path: |
            cloud-nine-visual-replacements-v2-20261108/games/**/anchor-*.png
            cloud-nine-visual-replacements-v2-20261108/games/**/scene-*.png
          retention-days: 3
          if-no-files-found: ignore

  upload-three-private-only-after-verified-mp4:
    needs: [render-exact-three-gamer-with-character-anchor, protected-main-only-youtube-environment]
    if: >-
      needs.render-exact-three-gamer-with-character-anchor.result == 'success' &&
      needs.protected-main-only-youtube-environment.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: youtube-private-upload
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Google YouTube API, FFprobe, original image integrity tools only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Download only these 3 successfully produced Gamer V2 original files
        uses: actions/download-artifact@v4
        with:
          name: nine-replacements-visual-v2-games-review-20261108
          path: cloud-nine-visual-replacements-v2-20261108/games/
      - name: Verify unchanged old public videos, all 3 V2 SHA-256s, exact Gamer channel then upload PRIVATE one by one
        env:
          REPLACEMENTS_HTTP400_FIX_APPROVED: 'yes'
          REPLACEMENTS_PRIVATE_STAGE_APPROVED: 'yes'
          REPLACEMENTS_CHANNEL: games
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_GAMES_TOKEN_JSON }}
        run: python scripts/nine_visual_replacements_v2_upload_20261108.py --channel games --action upload
      - name: Save actual YouTube replacement video IDs even if cover verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nine-v2-games-private-replacement-receipts-20261108
          path: cloud-nine-visual-replacements-v2-20261108/games/youtube-v2-private-upload-receipts.json
          retention-days: 7
          if-no-files-found: ignore
