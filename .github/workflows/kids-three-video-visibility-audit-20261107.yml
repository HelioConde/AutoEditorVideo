name: Emanuelly Kids - diagnose 3 YouTube video visibility read only

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/kids-three-studio-visibility-audit-20261107.json'

permissions:
  contents: read

concurrency:
  group: kids-three-visibility-audit-20261107
  cancel-in-progress: false

jobs:
  approve-readonly-contract:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'diagnose(kids): run read-only Studio visibility audit for three IDs'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile audit and block any write methods
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m py_compile scripts/kids_three_video_visibility_audit_20261107.py
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('scripts/kids_three_video_visibility_audit_20261107.py').read_text()
          banned=('videos().insert(', 'videos().update(', 'videos().delete(',
                  'thumbnails().set(', 'request_image(', 'ensure_voice(', 'render_one(')
          assert all(x not in p for x in banned), 'READ_ONLY_CONTRACT_VIOLATION'
          manifest=json.loads(Path('conteudos/kids-three-studio-visibility-audit-20261107.json').read_text())
          assert manifest['video_ids']==['d7hjFP6Ky6w','ax0ude5BUhE','It-7R1o9k7Q']
          assert manifest['youtube_channel_id']=='UCxEzVW2Uy44OUVurTQSg_Eg'
          assert manifest['videos_insert'] is False
          print('KIDS_READ_ONLY_NO_UPLOAD_CONTRACT_PASSED')
          PY

  check-protected-youtube:
    needs: approve-readonly-contract
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Youtube Environment restricted to main without OAuth
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os
          from youtube_new_channels_env_guard import fetch_protected_policy,policy_is_main_only
          env,policies=fetch_protected_policy('kids',os.environ.get('GH_TOKEN',''))
          policy_is_main_only('kids',env,policies)
          print('KIDS_READ_ONLY_AUDIT_YOUTUBE_ENV_SAFE')
          PY

  inspect-three:
    needs: [approve-readonly-contract, check-protected-youtube]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: youtube-private-upload
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google readonly API SDK
        run: python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Query exact three YouTube video IDs plus upload playlist and processing statuses
        env:
          KIDS_READONLY_AUDIT_APPROVED: 'yes'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_KIDS_TOKEN_JSON }}
        run: python scripts/kids_three_video_visibility_audit_20261107.py
      - name: Keep sanitized status-only diagnostic report, even when a video is missing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-three-studio-visibility-status-report-20261107
          path: kids-three-studio-visibility-audit-20261107.json
          retention-days: 7
          if-no-files-found: ignore
