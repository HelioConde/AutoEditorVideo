name: Arquivo Otaku — testes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -U pip pytest 'Pillow>=10,<13' 'numpy>=1.24,<3' 'requests>=2.31,<3' 'PyYAML>=6,<7'
      - name: Testes locais sem APIs e sem upload
        run: python -m pytest -q tests
