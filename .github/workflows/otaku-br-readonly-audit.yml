name: Otaku Multicena BR - auditoria leitura YouTube sem alterar videos
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_otaku_br_views.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otaku-multicena-br-readonly-audit
  cancel-in-progress: false

jobs:
  public-video-performance:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: youtube-private-upload
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-publicacao.txt
      - name: Install readonly YouTube API prerequisites
        run: python -m pip install -r requirements-publicacao.txt
      - name: Fetch only channel and video public statistics
        env:
          YOUTUBE_BR_TOKEN_JSON: ${{ secrets.YOUTUBE_BR_TOKEN_JSON }}
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
        run: python scripts/audit_otaku_br_views.py
      - name: Preserve non-sensitive public metrics only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: otaku-multicena-public-view-audit
          path: audit-output/otaku-multicena-public-stats.json
          retention-days: 7
          if-no-files-found: error
