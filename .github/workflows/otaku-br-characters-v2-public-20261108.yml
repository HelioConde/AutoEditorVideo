name: Otaku Multicena BR - publish character-faithful V2 after visual QA

on:
  push:
    branches: [main]
    paths:
      - 'conteudos/otaku-br-character-v2-public-approval-20261108.json'

permissions:
  contents: read

concurrency:
  group: otaku-br-canonical-character-v2-public-one-shot
  cancel-in-progress: false

jobs:
  visual-approval-preflight:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'feat(otaku): publish visually approved canonical character V2 Shorts publicly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no generic character prompts can be used and approval exists
        run: |
          python -m pip install 'Pillow>=10,<13' 'pytest>=8,<10'
          python -m py_compile scripts/otaku_br_character_v2_publish_20261108.py
          python -m pytest -q tests/test_otaku_character_v2_20261108.py
          python scripts/otaku_br_character_v2_publish_20261108.py --action preflight
          python - <<'PY'
          import json
          d=json.load(open('conteudos/otaku-br-character-v2-public-approval-20261108.json',encoding='utf-8'))
          assert d['schema']=='autoeditorvideo/otaku-br-v2-character-review-approval/v1'
          assert d['source_run_id']==42444319178
          assert d['source_artifact']=='otaku-br-three-canonical-characters-v2-review-20261108'
          assert d['channel_id']=='UCXGYTuBYn-0Ziqin5ajKhOw'
          assert d['visual_review_by_assistant'] is True
          assert d['reviewed_all_anchors_and_story_scenes'] is True
          assert d['no_fake_approvals'] is True
          assert d['creator_publication_authorized'] is True
          assert d['preserve_originals_until_replacement_verified'] is True
          assert [x['id'] for x in d['approved_episodes']]==[
            '5012-solo-leveling-igris-v2',
            '5013-blue-lock-isagi-v2',
            '5014-mob-psycho-emocoes-v2']
          print('CANONICAL_OTAKU_V2_VISUAL_APPROVAL_CONTRACT_PRESENT')
          PY

  protected-br-youtube-environment:
    needs: visual-approval-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce only main branch on shared YouTube secrets before BR OAuth
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/youtube_env_policy_guard.py

  publish-three-and-reconcile-known-wrong-video:
    needs: [visual-approval-preflight, protected-br-youtube-environment]
    runs-on: ubuntu-latest
    timeout-minutes: 115
    environment: youtube-private-upload
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official YouTube SDK and ffprobe, no image-generation secrets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements-publicacao.txt 'Pillow>=10,<13'
      - name: Download exact previously generated and visually reviewed three canonical MP4s and their artwork
        uses: actions/download-artifact@v4
        with:
          name: otaku-br-three-canonical-characters-v2-review-20261108
          run-id: 42444319178
          github-token: ${{ github.token }}
          path: cloud-otaku-br-characters-v2-20261108/br/
      - name: Verify all image anchors and frames, correct channel and PUBLIC upload sequentially without duplicate
        env:
          OTAKU_V2_VISUAL_REVIEW_AND_PUBLIC_AUTHORIZED: 'yes'
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_BR_TOKEN_JSON }}
        run: python scripts/otaku_br_character_v2_publish_20261108.py --action publish
      - name: Preserve verified public YouTube video IDs, thumbnail status and guarded deletion result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otaku-br-three-canonical-v2-public-youtube-receipts-20261108
          path: cloud-otaku-br-characters-v2-20261108/br/br-three-character-v2-youtube-receipts.json
          retention-days: 7
          if-no-files-found: ignore
