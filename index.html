<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    body {
        font-family: sans-serif, Arial, Helvetica;
    }

    main {
        display: flex;
        flex-direction: column;
        align-items: center;
        align-content: center;
        justify-content: center;
        flex-wrap: nowrap;
        height: 100vh;
    }

    input,
    textarea {
        width: 250px;
        text-align: center;
        background: none;
        border: 2px solid rgb(0, 2, 97);
        border-radius: 20px;
        padding: 5px 0;
    }

    input::placeholder,
    textarea::placeholder {
        width: 250px;
        text-align: center;
    }

    .submit,
    .view {
        border: 2px solid rgba(0, 0, 0, 0.459);
        border-radius: 100px;
        padding: 10px 40px;
        background: none;
        cursor: pointer;
        width: 140px;
    }

    #main {
        display: flex;
        flex-direction: column;
        align-items: center;
        align-content: center;
        justify-content: center;
        flex-wrap: nowrap;
        border-radius: 50px;
        padding: 50px;
        background: rgba(0, 0, 0, 0.2);
        border: 2px solid rgb(139, 0, 139);
    }

    #main div {
        margin: 1% 0;
    }

    header,
    footer {
        width: 100%;
    }

    header {
        position: absolute;
        top: 0;
        left: 0;
        z-index: -1;
    }

    footer {
        position: absolute;
        bottom: 0;
        left: 0;
        z-index: -1;
    }

    .buttons {
        display: flex;
    }
</style>

<body>
    <main>
        <header>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
                <path fill="#a2d9ff" fill-opacity="1"
                    d="M0,256L120,0L240,96L360,96L480,96L600,256L720,96L840,128L960,224L1080,64L1200,64L1320,0L1440,224L1440,0L1320,0L1200,0L1080,0L960,0L840,0L720,0L600,0L480,0L360,0L240,0L120,0L0,0Z">
                </path>
            </svg>
        </header>
        <div id="main">
            <div>
                <h1>Editor Automatico de Vídeo</h1>
            </div>
            <div>
                <input type="text" name="" id="titulo" placeholder="Titulo">
            </div>
            <div>
                <textarea name="" id="texto" cols="30" rows="10" placeholder="Texto"></textarea>
            </div>
            <div>
                <audio id="preview" controls>
                    <source type="audio/ogg">
                    <source type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
            </div>
            <!--<input type="file" name="" id="" multiple> Talvez adicionar essa opção no futuro-->
            <input type="url" name="" id="imag1">
            <div class="buttons">
                <div><button id="view" class="view">Visualizar</button></div>
                <div><button id="submit" class="submit" disabled>Enviar</button></div>
            </div>
            <div>
                <h6>
                    <p>
                        Esse site edita de forma automatica o seu vídeo!
                    </p>
                    <p>
                        Coloque o titulo e um texto e ele transforma em um arquivo de audio automaticamente
                    </p>
                </h6>
            </div>
        </div>
        <footer>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
                <path fill="#a2d9ff" fill-opacity="1"
                    d="M0,96L24,101.3C48,107,96,117,144,106.7C192,96,240,64,288,64C336,64,384,96,432,138.7C480,181,528,235,576,224C624,213,672,139,720,117.3C768,96,816,128,864,138.7C912,149,960,139,1008,128C1056,117,1104,107,1152,138.7C1200,171,1248,245,1296,256C1344,267,1392,213,1416,186.7L1440,160L1440,320L1416,320C1392,320,1344,320,1296,320C1248,320,1200,320,1152,320C1104,320,1056,320,1008,320C960,320,912,320,864,320C816,320,768,320,720,320C672,320,624,320,576,320C528,320,480,320,432,320C384,320,336,320,288,320C240,320,192,320,144,320C96,320,48,320,24,320L0,320Z">
                </path>
            </svg>
        </footer>
    </main>
</body>
<script>
    let submit = document.getElementById("submit");
    let view = document.getElementById("view");
    let texto = document.getElementById("texto");
    let titulo = document.getElementById("titulo");
    let preview = document.getElementById("preview");
    let imag1 = document.getElementById("imag1");

    //submit.addEventListener("mousedown", mouseDown)
    view.addEventListener("mouseup", viewUp);
    submit.addEventListener("mouseup", submitUp);

    function viewUp() {
        if (!texto.value == "") {
            if (!imag1.value == "") {

            }
            submit.disabled = false;
            preview.src = "https://text-to-speech-demo.ng.bluemix.net/api/v3/synthesize?text=" + encodeURI(texto.value) + "&voice=pt-BR_IsabelaV3Voice&download=true&accept=audio%2Fmp3";
        } else {
            submit.disabled = true;
        }
    }

    function submitUp() {
        let data = {
            texto: texto.value,
            titulo: titulo.value,
        };

        fetch("/audioGerador/", {
            method: "POST",
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(res => {
            console.log("Request complete! response:", res);
        });

        data = {
            texto: imag1.value,
            titulo: titulo.value,
        };

        fetch("/imgGerador/", {
            method: "POST",
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(res => {
            console.log("Request complete! response:", res);
        });
    }
</script>

</html>
